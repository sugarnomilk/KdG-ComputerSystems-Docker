{id:"R3-3",topic:"t5",type:"mc",pts:1,
 q:"Deze Dockerfile wordt gebouwd als <code>logtest</code>:<pre>FROM alpine:3.20\nRUN echo \"gebouwd\" >> /log.txt\nCMD [\"sh\", \"-c\", \"echo gestart >> /log.txt && cat /log.txt\"]</pre>Daarna voer je uit:<pre>$ docker run --name t logtest\n$ docker start -a t</pre>(<code>-a</code> toont de output in je terminal.) Wat is de output van <code>docker start -a t</code>?",
 opts:["<code>gebouwd</code> / <code>gestart</code>","<code>gebouwd</code> / <code>gestart</code> / <code>gestart</code>","<code>gebouwd</code> / <code>gestart</code> / <code>gebouwd</code> / <code>gestart</code>","<code>gestart</code>"],ok:[1],
 ex:["RUN gebeurt één keer, bij <code>docker build</code>. CMD draait bij elke start.","<code>docker start</code> herstart dezelfde container; zijn read/write-laag (met de eerste <code>gestart</code>) blijft tot <code>docker rm</code>."]},
{id:"R3-11",topic:"t5",type:"mc",pts:1,
 q:"Deze Dockerfile wordt gebouwd als <code>kdgstudent/app</code>:<pre>FROM alpine:3.20\nCMD [\"ping\", \"-c\", \"3\", \"localhost\"]</pre>Wat gebeurt er bij <code>docker run --rm kdgstudent/app kdg.be</code>?",
 opts:["Er wordt 3 keer naar <code>kdg.be</code> gepingd.","Eerst wordt 3 keer <code>localhost</code> gepingd, daarna <code>kdg.be</code>.","Een foutmelding: Docker probeert een programma met de naam <code>kdg.be</code> te starten, en dat bestaat niet.","Docker voert <code>ping -c 3 localhost kdg.be</code> uit."],ok:[2],
 ex:["Alles na de imagenaam vervangt de volledige CMD. D zou het gedrag van een ENTRYPOINT zijn (argumenten erachter geplakt)."]},
{id:"R3-6",topic:"t6",type:"mc",pts:1,
 q:"<pre>FROM node:22-alpine\nLABEL maintainer=\"student@kdg.be\"\nENV NODE_ENV=production\nCOPY package.json /app/\nRUN cd /app && npm install\nCOPY . /app\nEXPOSE 3000\nUSER node\nCMD [\"node\", \"/app/server.js\"]</pre>Hoeveel <b>nieuwe lagen</b> voegt deze Dockerfile toe bovenop <code>node:22-alpine</code>?",
 opts:["2","3","5","8"],ok:[1],
 ex:["Enkel RUN, COPY en ADD maken een laag. LABEL, ENV, EXPOSE, USER en CMD zijn metadata. FROM neemt de lagen van de base image over."]},
{id:"R3-8",topic:"t6",type:"multi",pts:2,
 q:"<pre>FROM python:3.13-slim\nENV API_KEY=sk-12345geheim\nCOPY app.py /app/\nCMD [\"python\", \"/app/app.py\"]</pre>Je bouwt deze image en pusht ze <b>publiek</b> naar Docker Hub als <code>kdgstudent/bot:1.0</code>. Welke uitspraken zijn juist?",
 opts:["Iedereen die de image pullt, kan de sleutel lezen, bv. met <code>docker image inspect</code> of <code>docker history</code>.","Omdat ENV geen laag maakt, zit de sleutel niet in de image.","Beter is de sleutel pas bij het opstarten aan te bieden, bv. als bestand via een bind mount of met Compose secrets.","Je verwijdert de ENV-regel, bouwt opnieuw en pusht als <code>1.1</code>. Daarmee is het probleem volledig opgelost.","Je moet de API-sleutel ongeldig maken en vervangen door een nieuwe, want versie <code>1.0</code> staat al publiek."],ok:[0,2,4],
 ex:["ENV maakt geen bestandslaag, maar de waarde zit in de metadata en gaat mee bij elke push. Een gepushte image repareer je niet: sleutel intrekken."]},
{id:"R3-14",topic:"t6",type:"mc",pts:1,
 q:"<pre>FROM node:22-alpine\nWORKDIR /app\nCOPY package.json .\nRUN npm install\nCOPY . .\nCMD [\"node\", \"server.js\"]</pre><code>npm install</code> duurt 90 seconden. Je past bijna elke dag <code>server.js</code> aan, maar <code>package.json</code> wijzigt zelden. Waarom wordt <code>package.json</code> apart en eerst gekopieerd?",
 opts:["Zolang <code>package.json</code> niet wijzigt, komt <code>npm install</code> uit de cache. Wijzig je enkel <code>server.js</code>, dan wordt pas vanaf <code>COPY . .</code> opnieuw gebouwd.","Omdat <code>COPY . .</code> bestanden zoals <code>package.json</code> niet meekopieert.","Omdat <code>npm install</code> pas kan draaien nadat de container gestart is.","Zo wordt de image kleiner, want <code>package.json</code> zit dan maar één keer in de image."],ok:[0],
 ex:["RUN gebeurt bij <code>docker build</code>. Wijzigt een regel (of het bestand dat een COPY kopieert), dan wordt alles vanaf daar opnieuw uitgevoerd."]},
{id:"R3-13",topic:"t7",type:"multi",pts:2,
 q:"<pre>$ docker images\nREPOSITORY   TAG   IMAGE ID\nwebapp       1.0   8e2d4c1a9f03\n$ docker tag webapp:1.0 kdgstudent/webapp:1.0\n$ docker tag webapp:1.0 kdgstudent/webapp:latest</pre>Welke uitspraken zijn juist?",
 opts:["<code>docker images</code> toont nu 3 regels, allemaal met IMAGE ID <code>8e2d4c1a9f03</code>.","De image neemt nu ongeveer drie keer zoveel schijfruimte in.","<code>docker push kdgstudent/webapp:1.0</code> pusht enkel de tag <code>1.0</code>; <code>latest</code> moet je apart pushen.","<code>docker rmi webapp:1.0</code> verwijdert de image volledig, dus ook <code>kdgstudent/webapp:1.0</code> is weg.","Ben je niet ingelogd met <code>docker login</code>, dan wordt de push geweigerd (<i>denied</i>)."],ok:[0,2,4],
 ex:["Drie labels, één image: geen extra schijfruimte. Je pusht per tag. <code>rmi</code> van één tag = <i>Untagged</i>."]},
{id:"R4-1",topic:"t1",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name batch alpine:3.20 echo klaar\n$ docker run -d --name db postgres:16\n$ docker run -d --name api --memory 256m kdgstudent/api:2.1\n$ docker ps -a\nIMAGE                STATUS                       NAMES\nkdgstudent/api:2.1   Exited (137) 1 minute ago    api\npostgres:16          Exited (1) 2 minutes ago     db\nalpine:3.20          Exited (0) 3 minutes ago     batch</pre>De app in <code>api</code> laadt bij het opstarten 1 GB in het geheugen. De host heeft 16 GB RAM, grotendeels vrij. Bij <code>db</code> werd geen <code>POSTGRES_PASSWORD</code> meegegeven. Welke uitspraken zijn juist?",
 opts:["<code>batch</code> is normaal afgelopen: het hoofdproces <code>echo</code> was klaar.","<code>db</code> stopte met een fout. Met <code>docker logs db</code> kan je nog nagaan waarom.","Om de fout van <code>db</code> te onderzoeken, open je een shell met <code>docker exec -it db sh</code>.","<code>api</code> werd door de kernel gekild omdat hij boven zijn cgroup-limiet van 256 MB ging; de host zelf had nog genoeg geheugen.","Met <code>docker restart api</code> is het probleem opgelost, want bij een herstart verdwijnt de geheugenlimiet."],ok:[0,1,3],
 ex:["<code>logs</code> werkt ook op een gestopte container, <code>exec</code> enkel op een draaiende.","De geheugenlimiet hoort bij de container: <code>restart</code> lost niets op, je maakt hem opnieuw aan met een hogere <code>--memory</code>."]},
{id:"R4-2",topic:"t2",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name a busybox\n$ docker run -d --name b nginx:1.27\n$ docker run -dit --name c busybox\n$ docker run -d --name d alpine:3.20 sleep 3600</pre>De standaard-CMD van <code>busybox</code> is <code>sh</code>. Welke containers staan <b>na 1 minuut</b> nog op <code>Up</code>?",
 opts:["<code>a</code>","<code>b</code>","<code>c</code>","<code>d</code>","Geen enkele: met <code>-d</code> stopt een container meteen na het opstarten."],ok:[1,2,3],
 ex:["Een container leeft zolang zijn hoofdproces leeft. nginx is een server, <code>sleep 3600</code> duurt een uur, <code>sh</code> met <code>-it</code> blijft open. <code>sh</code> zonder <code>-it</code> krijgt geen invoer en stopt meteen.","<code>-it</code> is dus niet de enige reden waarom een container blijft draaien."]},
{id:"R4-3",topic:"t2",type:"multi",pts:2,
 q:"<pre>$ docker images\nREPOSITORY   TAG   IMAGE ID       SIZE\nmyapp        1.0   3f2a9b7c1d44   142MB\n\n$ docker ps\nCONTAINER ID   IMAGE       COMMAND            STATUS         NAMES\n9c1e5d2a8b31   myapp:1.0   \"node server.js\"   Up 5 minutes   api</pre>Welke commando's werken zoals bedoeld?",
 opts:["<code>docker inspect 3f2a</code> (toont de metadata van de image)","<code>docker inspect api</code> (toont de metadata van de container)","<code>docker stop 3f2a</code> (stopt de draaiende app)","<code>docker exec -it 9c1e sh</code> (opent een shell in de draaiende app)","<code>docker logs 3f2a</code> (toont de output van de app)"],ok:[0,1,3],
 ex:["<code>inspect</code> werkt op allebei. <code>stop</code>, <code>exec</code> en <code>logs</code> enkel op een container; <code>3f2a</code> is een image ID."]},
{id:"R4-5",topic:"t2",type:"multi",pts:2,
 q:"Op een server toont <code>docker ps</code> 2 containers en <code>docker ps -a</code> 5 containers. Niemand gebruikte <code>--rm</code>. Welke uitspraken zijn juist?",
 opts:["Een container draait één of meer processen geïsoleerd van andere processen; namespaces dragen (samen met cgroups) bij aan die isolatie.","De 3 gestopte containers zijn al verwijderd; <code>docker rm</code> is voor hen niet meer nodig.","Bestanden die in een van de 3 gestopte containers werden aangemaakt, staan nog in hun read/write-laag.","De 3 containers die enkel in <code>docker ps -a</code> staan, draaien met <code>-d</code> op de achtergrond.","Elke container heeft een eigen kernel; namespaces en cgroups zijn daarom niet nodig.","Na <code>docker rm</code> van zo'n gestopte container verdwijnt hij ook uit <code>docker ps -a</code>, samen met zijn read/write-laag."],ok:[0,2,5],
 ex:["Read/write-laag: bewaard zolang de container gestopt is, weg zodra hij verwijderd wordt.","Namespaces en cgroups zorgen samen voor de echte isolatie; er is één gedeelde kernel."]},
{id:"R4-6",topic:"t3",type:"multi",pts:2,
 q:"Een app luistert in de container op poort <b>3000</b>. De Dockerfile bevat <code>EXPOSE 3000</code>. De host heeft IP <code>192.168.121.199</code>, poort 80 en 8080 zijn vrij.<pre>$ docker run -d --name shop kdgstudent/shop:1.0</pre>Welke uitspraken zijn juist?",
 opts:["Zo is de app niet bereikbaar via het IP van de host, ook al staat <code>EXPOSE 3000</code> in de image.","Met <code>-p 3000:80</code> is de app bereikbaar op <code>http://192.168.121.199:3000</code>.","Met <code>-p 80:3000</code> is de app bereikbaar op <code>http://192.168.121.199</code>.","Naast een container met <code>-p 80:3000</code> kan je een tweede container van dezelfde image starten met <code>-p 8080:3000</code>.","Om de container <code>shop</code> alsnog te publiceren, voer je <code>docker restart -p 80:3000 shop</code> uit."],ok:[0,2,3],
 ex:["Altijd <code>-p HOSTPOORT:CONTAINERPOORT</code> (van buiten naar binnen). <code>-p 3000:80</code> stuurt naar poort 80 in de container, waar niets luistert.","EXPOSE publiceert niets. Een poort wijzigen = de container opnieuw aanmaken."]},
{id:"R4-7",topic:"t3",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name db1 -e POSTGRES_PASSWORD=x \\\n    -v pgdata:/var/lib/postgresql/data postgres:16\n$ docker run -d --name db2 -e POSTGRES_PASSWORD=x \\\n    -v pgdata2:/var/lib/postgresql/data postgres:16</pre>Vooraf bestonden er geen volumes. Welke uitspraken zijn juist?",
 opts:["<code>docker volume ls</code> toont <code>pgdata</code> en <code>pgdata2</code>, ook al heb je ze nooit zelf aangemaakt.","Omdat <code>db1</code> en <code>db2</code> van dezelfde image komen, delen ze automatisch dezelfde databank.","Na <code>docker rm -f db1</code> verschijnt <code>pgdata</code> nog in de uitvoer van <code>docker volume ls</code>.","<code>docker volume inspect db1</code> toont waar de data van <code>db1</code> opgeslagen is.","Een derde container met <code>-v pgdata:/backup</code> ziet in <code>/backup</code> dezelfde bestanden die <code>db1</code> in zijn datamap ziet."],ok:[0,2,4],
 ex:["<code>db1</code> is een containernaam, geen volume: <code>docker volume inspect</code> verwacht de volumenaam (<code>pgdata</code>). Elk soort object heeft zijn eigen naam."]},
{id:"R4-8",topic:"t3",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name web1 -v /srv/web:/usr/share/nginx/html nginx:1.27\n$ docker run -d --name web2 -v web:/usr/share/nginx/html nginx:1.27</pre>Welke uitspraken zijn juist?",
 opts:["<code>web1</code> gebruikt een bind mount: een bestand dat je op de host in <code>/srv/web</code> zet, ziet nginx meteen.","<code>web2</code> gebruikt de map <code>/web</code> op de host.","Na <code>docker rm -f web1 web2</code> staat de map <code>/srv/web</code> nog op de host en bestaat het volume <code>web</code> nog.","<code>docker volume rm web</code> verwijdert ook de bestanden in <code>/srv/web</code>.","Een nieuwe container met <code>-v web:/usr/share/nginx/html</code> ziet dezelfde bestanden als <code>web2</code>."],ok:[0,2,4],
 ex:["Een pad = bind mount (jouw map, Docker raakt ze niet aan). Een naam = named volume (Docker beheert de opslag)."]},
{id:"R4-10",topic:"t5",type:"multi",pts:2,
 q:"Deze Dockerfile wordt gebouwd als <code>kdgstudent/groet:1.0</code>:<pre>FROM alpine:3.20\nENTRYPOINT [\"echo\", \"Hallo\"]\nCMD [\"wereld\"]</pre>Welke uitspraken zijn juist?",
 opts:["<code>docker run --rm kdgstudent/groet:1.0</code> geeft: <code>Hallo wereld</code>","<code>docker run --rm kdgstudent/groet:1.0 Gent</code> geeft: <code>Gent</code>","<code>docker run --rm kdgstudent/groet:1.0 Gent en Brugge</code> geeft: <code>Hallo Gent en Brugge</code>","<code>docker run --rm kdgstudent/groet:1.0 ls</code> toont de bestanden in de container.","Voeg je onderaan nog een tweede ENTRYPOINT-regel toe, dan wordt enkel die laatste gebruikt."],ok:[0,2,4],
 ex:["Alles na de imagenaam vervangt de CMD en komt achter de ENTRYPOINT: <code>ls</code> wordt <code>Hallo ls</code>. Meerdere ENTRYPOINT's of CMD's: enkel de laatste telt."]},
{id:"R4-11",topic:"t6",type:"multi",pts:2,
 q:"Op <b>1 november</b> bouwde je deze image als <code>buildinfo</code>:<pre>FROM debian:13\nRUN date > /build-time.txt\nCMD [\"cat\", \"/build-time.txt\"]</pre>Op <b>5 november</b> voer je, zonder iets te wijzigen, opnieuw <code>docker build -t buildinfo .</code> uit en daarna <code>docker run --rm buildinfo</code>. De build cache is niet opgeruimd. Welke uitspraken zijn juist?",
 opts:["Je ziet nog steeds de datum van 1 november: de RUN-stap komt uit de cache.","Je ziet 5 november, omdat <code>docker build</code> elke RUN-stap altijd opnieuw uitvoert.","Bouw je met <code>docker build --no-cache -t buildinfo .</code> en start je daarna, dan zie je 5 november.","Zet je vóór de RUN-regel <code>ENV REFRESHED_AT=2026-11-05</code>, dan wordt de RUN-stap opnieuw uitgevoerd.","Zet je die ENV-regel ná de RUN-regel, dan wordt de RUN-stap ook opnieuw uitgevoerd."],ok:[0,2,3],
 ex:["Twee manieren om een RUN-stap opnieuw te laten lopen: <code>--no-cache</code> (alles opnieuw) of een regel erboven wijzigen (alles vanaf die regel opnieuw)."]},
{id:"R4-13",topic:"t6",type:"multi",pts:2,
 q:"Je team kiest base images voor vier microservices. Welke uitspraken zijn juist?",
 opts:["<code>FROM node:22-alpine</code> is beter dan <code>FROM node:latest</code>: je weet welke versie je bouwt.","Een distroless image is de beste keuze als je vaak met <code>docker exec -it ... sh</code> wil debuggen.","Vertrekken de vier services van dezelfde base image, dan staan die gedeelde lagen maar één keer op de host.","Laat de containers best als root draaien, zodat de app overal mag schrijven.","Een container draait idealiter één applicatie (single purpose).","Alpine en busybox bevatten geen shell; daarvoor heb je een volledige distributie zoals Debian nodig."],ok:[0,2,4],
 ex:["Distroless heeft net géén shell. Alpine en busybox zijn minimale distributies mét shell."]},
{id:"R4-14",topic:"t7",type:"multi",pts:2,
 q:"Je Docker Hub-account heet <code>kdgstudent</code> en je bent al ingelogd.<pre>$ docker build -t webshop:2.0 .\n$ docker push webshop:2.0\ndenied: requested access to the resource is denied</pre>Welke uitspraken zijn juist?",
 opts:["Docker probeerde naar <code>docker.io</code> te pushen, omdat er geen registry in de naam staat.","<code>docker tag webshop:2.0 kdgstudent/webshop:2.0</code> en daarna <code>docker push kdgstudent/webshop:2.0</code> lost het op zonder opnieuw te bouwen.","Opnieuw bouwen met <code>docker build -t kdgstudent/webshop:2.0 .</code> is de enige oplossing.","Wil je naar een eigen registry op poort 5000 van deze host pushen, dan tag je de image als <code>localhost:5000/webshop:2.0</code>.","<code>docker push kdgstudent webshop:2.0</code> pusht de image naar het account <code>kdgstudent</code>."],ok:[0,1,3],
 ex:["Zonder registry in de naam = <code>docker.io</code>. Opnieuw taggen volstaat: een tag is een extra label, geen kopie."]},
{id:"R4-15",topic:"t7",type:"multi",pts:2,
 q:"<pre>$ docker images\nREPOSITORY   TAG       IMAGE ID       CREATED        SIZE\nbusybox      1.38.0    6d3e4188a38a   9 months ago   4.28MB\nbusybox      latest    6d3e4188a38a   9 months ago   4.28MB</pre>Een maand later verschijnt op Docker Hub een nieuwe busybox met de tag <code>latest</code>. Lokaal heb je nog niets gedaan. Welke uitspraken zijn juist?",
 opts:["Lokaal blijft <code>busybox:latest</code> naar <code>6d3e4188a38a</code> wijzen tot je <code>docker pull busybox</code> uitvoert.","Na <code>docker pull busybox</code> wijst <code>busybox:latest</code> naar een nieuw IMAGE ID, en <code>busybox:1.38.0</code> nog naar <code>6d3e4188a38a</code>.","<code>docker run busybox</code> haalt automatisch de nieuwe versie op, omdat de tag <code>latest</code> is.","<code>docker tag busybox:1.38.0 mijnbusybox:stabiel</code> voegt een regel toe met hetzelfde IMAGE ID <code>6d3e4188a38a</code>.","Welke versie achter <code>latest</code> zit, zie je met <code>docker ps -a</code>."],ok:[0,1,3],
 ex:["Tags kunnen verschuiven, maar je moet pullen om te weten of er iets veranderd is. <code>docker run</code> downloadt enkel als de image lokaal nog niet bestaat. Het versienummer zie je met <code>docker image history busybox</code>."]},
{id:"R5-1",topic:"t1",type:"multi",pts:2,
 q:"Welke uitspraken zijn juist?",
 opts:["chroot verandert enkel de root-map van een proces en zijn kindprocessen; kernel, processen, netwerk en gebruikers blijven gedeeld met de host.","Namespaces en cgroups voegen de echte isolatie toe die chroot alleen niet biedt.","Met cgroups bepaal je welke processen een container kan zien.","Gaat een proces in een cgroup met een geheugenlimiet daarover, dan wordt het gekild.","Een container van een Ubuntu-image draait op een Ubuntu-kernel, ook als de host AlmaLinux is."],ok:[0,1,3],
 ex:["Namespaces = wat een proces <b>ziet</b>; cgroups = <b>hoeveel</b> het mag gebruiken.","Er is één gedeelde kernel: die van de host."]},
{id:"R5-2",topic:"t1",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name rapport  --memory 128m kdgstudent/rapport:1.0\n$ docker run -d --name rapport2 kdgstudent/rapport:1.0</pre>De app heeft ongeveer 500 MB geheugen nodig. De host heeft 8 GB RAM, grotendeels vrij. Welke uitspraken zijn juist?",
 opts:["<code>rapport</code> kan gekild worden omdat het over zijn cgroup-limiet gaat, terwijl <code>rapport2</code> gewoon kan blijven werken.","De limiet van 128 MB geldt ook voor <code>rapport2</code>, omdat beide containers van dezelfde image komen.","Wordt <code>rapport</code> gekild, dan toont <code>docker ps -a</code> bij <code>Exited</code> een ander getal dan 0, en zoek je de oorzaak met <code>docker logs rapport</code>.","Om <code>rapport</code> meer geheugen te geven, voer je <code>docker restart --memory 1g rapport</code> uit.","Gaat <code>rapport</code> over zijn limiet, dan worden alle containers op de host gekild."],ok:[0,2],
 ex:["De limiet hoort bij de container (hoe hij aangemaakt is), niet bij de image.","<code>restart</code> neemt niets nieuws mee: meer geheugen = de container verwijderen en opnieuw aanmaken met <code>--memory 1g</code>."]},
{id:"R5-3",topic:"t2",type:"multi",pts:2,
 q:"<pre>$ docker images\nREPOSITORY   TAG   IMAGE ID       SIZE\nshop         2.0   a81c44e2d0f3   210MB\n\n$ docker ps -a\nCONTAINER ID   IMAGE      COMMAND            STATUS                    NAMES\n5be2a0c91d7e   shop:2.0   \"node worker.js\"   Exited (0) 3 minutes ago  worker\n77ac13f0b2e9   shop:2.0   \"node server.js\"   Up 10 minutes             api</pre>Welke commando's werken zoals bedoeld?",
 opts:["<code>docker logs worker</code> (toont de output van de gestopte worker)","<code>docker history shop:2.0</code> (toont de lagen van de image)","<code>docker exec -it worker sh</code> (opent een shell in worker)","<code>docker start worker</code> (start dezelfde container opnieuw)","<code>docker stop shop:2.0</code> (stopt api)","<code>docker logs a81c</code> (toont de output van api)"],ok:[0,1,3],
 ex:["<code>logs</code> werkt ook op een gestopte container, <code>exec</code> enkel op een draaiende.","<code>stop</code> en <code>logs</code> verwachten een container, geen image."]},
{id:"R5-4",topic:"t2",type:"multi",pts:2,
 q:"Er draaiden vooraf geen containers.<pre>$ docker run --name job1 alpine:3.20 echo één\néén\n$ docker run --rm --name job2 alpine:3.20 echo twee\ntwee\n$ docker run -d --name web nginx:1.27</pre>Een minuut later: welke uitspraken zijn juist?",
 opts:["<code>docker ps</code> toont enkel <code>web</code>.","<code>docker ps -a</code> toont <code>job1</code> en <code>web</code>, maar niet <code>job2</code>.","<code>docker ps -a</code> toont ook <code>job2</code>, met status <code>Exited (0)</code>.","<code>docker logs job1</code> toont nog \"één\".","<code>docker logs job2</code> toont nog \"twee\".","<code>docker ps</code> toont ook <code>job1</code>, omdat die zonder <code>-d</code> (op de voorgrond) gestart werd."],ok:[0,1,3],
 ex:["<code>--rm</code> verwijdert de container (en zijn logs) zodra hij stopt. Zonder <code>--rm</code> blijft hij bestaan als <code>Exited</code>, ook als hij op de voorgrond draaide."]},
{id:"R5-5",topic:"t3",type:"multi",pts:2,
 q:"Je start een database, maakt er tabellen in aan, en voert dan uit:<pre>$ docker run -d --name pg -e POSTGRES_PASSWORD=x \\\n    -v pgdata:/var/lib/postgresql/data postgres:16\n  ... (tabellen aangemaakt) ...\n$ docker rm -f pg\n$ docker run -d --name pg -e POSTGRES_PASSWORD=x \\\n    -v /srv/pgdata:/var/lib/postgresql/data postgres:16</pre>Welke uitspraken zijn juist?",
 opts:["De nieuwe container ziet een lege databank: <code>/srv/pgdata</code> is een map op de host, geen verwijzing naar het volume <code>pgdata</code>.","De nieuwe container ziet dezelfde tabellen, omdat het woord <code>pgdata</code> in beide commando's voorkomt.","Het volume <code>pgdata</code> met de oude tabellen bestaat nog en verschijnt in de uitvoer van <code>docker volume ls</code>.","Start je later een container met <code>-v pgdata:/var/lib/postgresql/data</code>, dan zie je de oude tabellen terug.","<code>docker rm -f pg</code> heeft het volume <code>pgdata</code> mee verwijderd."],ok:[0,2,3],
 ex:["Een pad en een naam zijn twee verschillende opslagplaatsen, ook al lijken de woorden op elkaar. <code>docker rm</code> raakt nooit aan volumes of hostmappen."]},
{id:"R5-6",topic:"t3",type:"multi",pts:2,
 q:"Op de host staat je website in <code>/srv/site</code> (met o.a. <code>index.html</code>). Je start:<pre>docker run -d --name web -p 8080:80 -v /srv/site:/usr/share/nginx/html nginx:1.27</pre>Welke uitspraken zijn juist?",
 opts:["Pas je <code>/srv/site/index.html</code> aan op de host, dan toont <code>http://host:8080</code> meteen de nieuwe versie, zonder de container te herstarten.","Na <code>docker rm -f web</code> is het bestand <code>/srv/site/index.html</code> op de host verwijderd.","Een tweede container met <code>-p 8081:80 -v /srv/site:/usr/share/nginx/html</code> toont dezelfde website.","Om een gewijzigde <code>index.html</code> te tonen, moet je eerst een nieuwe image bouwen.","Met <code>-v</code> kan je ook één enkel bestand mounten, bv. <code>-v /data/nginx.conf:/etc/nginx/nginx.conf</code>.","Met <code>-v site:/usr/share/nginx/html</code> zou nginx dezelfde bestanden uit <code>/srv/site</code> tonen."],ok:[0,2,4],
 ex:["Bind mount = live, de bestanden staan op de host. <code>site</code> zonder <code>/</code> is een naam (named volume), geen verwijzing naar <code>/srv/site</code>."]},
{id:"R5-7",topic:"t5",type:"multi",pts:2,
 q:"Deze Dockerfile wordt gebouwd als <code>kdgstudent/conv:1.0</code>:<pre>FROM python:3.13-slim\nCOPY convert.py /app/convert.py\nENTRYPOINT [\"python\", \"/app/convert.py\"]\nCMD [\"--help\"]</pre>Welke uitspraken zijn juist?",
 opts:["<code>docker run --rm kdgstudent/conv:1.0</code> voert <code>python /app/convert.py --help</code> uit.","<code>docker run --rm kdgstudent/conv:1.0 --input data.csv</code> voert <code>python /app/convert.py --input data.csv</code> uit.","<code>docker run --rm kdgstudent/conv:1.0 --input data.csv</code> voert <code>python /app/convert.py --help --input data.csv</code> uit.","<code>docker run --rm -it kdgstudent/conv:1.0 bash</code> opent een bash-shell in de container.","Met <code>docker run --rm -it --entrypoint /bin/bash kdgstudent/conv:1.0</code> vervang je de ENTRYPOINT en krijg je een shell."],ok:[0,1,4],
 ex:["Met een ENTRYPOINT wordt alles na de imagenaam een argument: D voert <code>python /app/convert.py bash</code> uit, geen shell.","Een shell krijg je enkel door de ENTRYPOINT te vervangen met <code>--entrypoint</code>."]},
{id:"R5-8",topic:"t6",type:"multi",pts:2,
 q:"Een collega past de Dockerfile aan, zodat de sleutel \"in dezelfde stap\" weer verwijderd wordt:<pre>FROM debian:13\nCOPY cert.key /tmp/cert.key\nRUN ./install-cert.sh /tmp/cert.key && rm /tmp/cert.key\nCMD [\"/app/start.sh\"]</pre>Welke uitspraken zijn juist?",
 opts:["De sleutel zit niet in de image, omdat ze in dezelfde RUN-regel verwijderd wordt.","De laag die door COPY gemaakt werd, bevat de sleutel nog; wie de image heeft, kan ze terughalen.","Door de <code>rm</code> in de RUN-regel wordt de image kleiner dan zonder die <code>rm</code>.","Een container van deze image vindt geen <code>/tmp/cert.key</code>, dus de image is veilig om publiek te pushen.","Het probleem verdwijnt als je de COPY-regel en de RUN-regel van plaats wisselt."],ok:[1],
 ex:["De sleutel wordt <b>aangemaakt in de COPY-laag</b> en <b>verwijderd in de RUN-laag</b>: twee verschillende lagen. Enkel aangemaakt én verwijderd in dezelfde RUN = niet in de image.","Een bestand uit een eerdere laag verwijderen maakt de image niet kleiner."]},
{id:"R5-9",topic:"t6",type:"multi",pts:2,
 q:"Versie <code>1.0</code> van <code>kdgstudent/api</code> werd vorige week publiek gepusht, toen nog <b>zonder</b> <code>.dockerignore</code>. Vandaag bouw en push je versie <code>1.1</code> met dit project:<pre>api/\n├── Dockerfile          (bevat: COPY . /app)\n├── .dockerignore       (bevat: .env)\n├── .gitignore          (bevat: .env)\n├── .env                (bevat: DB_PASSWORD=geheim)\n├── docker-compose.yml  (gebruikt ${DB_PASSWORD})\n└── server.js</pre>Welke uitspraken zijn juist?",
 opts:["In image <code>1.1</code> zit het bestand <code>.env</code> niet.","Image <code>1.0</code> op Docker Hub bevat het wachtwoord nog altijd.","Omdat <code>.env</code> in <code>.gitignore</code> staat, wordt het niet mee in de Git-repository opgenomen.","Je verandert best het databankwachtwoord, omdat versie <code>1.0</code> al publiek staat.","<code>.dockerignore</code> zorgt er ook voor dat <code>.env</code> niet in de Git-repository terechtkomt.","<code>docker compose up</code> kan <code>${DB_PASSWORD}</code> niet meer invullen, omdat <code>.env</code> in <code>.dockerignore</code> staat."],ok:[0,1,2,3],
 ex:["<code>.dockerignore</code> = uit de image, <code>.gitignore</code> = uit Git. Compose leest <code>.env</code> uit de projectmap, los van <code>.dockerignore</code>."]},
{id:"R5-10",topic:"t6",type:"multi",pts:2,
 q:"Je team stelt richtlijnen op voor de base images van nieuwe projecten. Welke uitspraken zijn in lijn met de cursus?",
 opts:["Een minimale distributie zoals alpine of busybox heeft een shell en een eenvoudige package manager.","<code>FROM ubuntu:latest</code> is de veiligste keuze: zo krijg je bij elke build vanzelf de nieuwste versie.","Zet bij voorkeur een webserver en een databank samen in één container, zodat je minder containers moet beheren.","Voeg zelf de ondersteunende tools toe die je nodig hebt, bv. ping of curl.","Een distroless image bevat wel een shell, maar geen package manager.","Een image van een onbekende uitgever is even betrouwbaar als een officiële image, zolang ze veel downloads heeft."],ok:[0,3],
 ex:["Scratch (leeg) · distroless (geen shell) · minimale distro zoals alpine/busybox (shell + eenvoudige package manager) · volledige distro (Ubuntu, Debian)."]},
{id:"R5-11",topic:"t7",type:"multi",pts:2,
 q:"Je bent op Docker Hub ingelogd als <code>kdgstudent</code>. Deze commando's lukken zonder fouten:<pre>$ docker build -t kdgstudent/blog .\n$ docker push kdgstudent/blog</pre>Welke uitspraken zijn juist?",
 opts:["Omdat er geen tag in de naam staat, werd de image gebouwd en gepusht als <code>kdgstudent/blog:latest</code>.","De image werd naar <code>docker.io</code> gepusht, omdat er geen registry vooraan in de naam staat.","Om dezelfde image ook als versie <code>1.0</code> te publiceren, volstaan <code>docker tag kdgstudent/blog kdgstudent/blog:1.0</code> en <code>docker push kdgstudent/blog:1.0</code>, zonder opnieuw te bouwen.","Een collega die ingelogd is als <code>jan</code>, kan met <code>docker push kdgstudent/blog:2.0</code> een nieuwe versie in jouw repository zetten."],ok:[0,1,2],
 ex:["Voluit: <code>docker.io/kdgstudent/blog:latest</code>. Zonder registry → <code>docker.io</code>, zonder tag → <code>latest</code>."]},
{id:"R5-12",topic:"t4",type:"mc",pts:1,
 q:"Je project met de services <code>web</code> en <code>db</code> draait met <code>docker compose up -d</code>. De website geeft een fout, en je wil de output van <b>beide</b> services live volgen terwijl je de pagina herlaadt. Je staat in de map met <code>docker-compose.yml</code>. Welk commando gebruik je?",
 opts:["<code>docker compose ps</code>","<code>docker compose logs -f</code>","<code>docker compose exec web logs</code>","<code>docker logs -f docker-compose.yml</code>"],ok:[1],
 ex:["<code>docker compose logs -f</code> volgt de output van alle services. <code>docker logs</code> verwacht een containernaam, geen bestand. Compose leest zelf <code>docker-compose.yml</code> in de huidige map."]},
{id:"R5-13",topic:"t5",type:"multi",pts:2,
 q:"De map <code>/app</code> bestaat nog niet in <code>node:22-alpine</code>.<pre>FROM node:22-alpine\nWORKDIR /app\nCOPY package.json .\nRUN npm install\nCOPY . .\nEXPOSE 3000\nCMD [\"node\", \"server.js\"]</pre>Welke uitspraken zijn juist?",
 opts:["<code>package.json</code> komt in de image terecht als <code>/app/package.json</code>.","Door <code>EXPOSE 3000</code> is de app via poort 3000 van de host bereikbaar, zonder <code>-p</code>.","Bij het starten zoekt node het bestand <code>server.js</code> in <code>/app</code>, omdat WORKDIR ook geldt voor CMD.","De build faalt, omdat <code>/app</code> eerst met <code>RUN mkdir /app</code> aangemaakt moet worden.","<code>npm install</code> wordt opnieuw uitgevoerd bij elke <code>docker run</code> van deze image."],ok:[0,2],
 ex:["WORKDIR maakt de map aan en geldt voor alle volgende RUN-, COPY-, CMD- en ENTRYPOINT-instructies. EXPOSE is documentatie. RUN gebeurt bij <code>docker build</code>."]},
{id:"R5-14",topic:"t6",type:"multi",pts:2,
 q:"Deze Dockerfile wordt in één keer gebouwd met <code>docker build -t hello:1.0 .</code><pre>FROM gcc:latest AS build\nCOPY helloworld.c /tmp/\nRUN gcc /tmp/helloworld.c -o /tmp/helloworld\n\nFROM busybox:latest\nCOPY --from=build /tmp/helloworld /helloworld\nCMD [\"/helloworld\"]</pre>Welke uitspraken over de image <code>hello:1.0</code> zijn juist?",
 opts:["De image vertrekt van busybox en bevat de gcc-compiler niet.","De image bevat ook <code>/tmp/helloworld.c</code>, omdat dat bestand in de eerste stage gekopieerd werd.","De naam <code>build</code> (na <code>AS</code>) is nodig zodat <code>COPY --from=build</code> weet uit welke stage het moet kopiëren.","Om dit te bouwen, voer je eerst een <code>docker build</code> uit voor de eerste stage en daarna een tweede <code>docker build</code> voor de tweede stage."],ok:[0,2],
 ex:["Elke FROM start een nieuwe, lege stage. In de eindimage zit enkel de laatste stage plus wat je met <code>COPY --from</code> overneemt: hier enkel het gecompileerde programma."]},
{id:"R5-15",topic:"t7",type:"fill",pts:2,
 q:"Gisteren startte je een eigen registry en pushte je er een image naar:<pre>$ docker run -d -p 5000:5000 --name registry registry:latest\n$ docker tag mynginx localhost:5000/mynginx:v1\n$ docker push localhost:5000/mynginx:v1</pre>Vannacht werd de host herstart. Vandaag lukt <code>docker push localhost:5000/mynginx:v2</code> niet, en <code>docker ps -a</code> toont de container <code>registry</code> als <code>Exited</code>. Met welk volledig commando start je deze bestaande registry-container opnieuw (zonder een nieuwe aan te maken)?",
 accept:["docker start registry","docker container start registry","start registry"],answer:"<code>docker start registry</code>",
 ex:["<code>start</code> werkt op een container: de naam uit de kolom NAMES. <code>localhost:5000/mynginx:v1</code> is een imagenaam.","Met <code>--restart=always</code> bij de eerste <code>docker run</code> was de registry na de reboot vanzelf gestart."]},
{id:"R5-16",topic:"t2",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name db \\\n    -e POSTGRES_USER=myuser \\\n    -e POSTGRES_PASSWORD=geheim \\\n    -e POSTGRES_DB=mydb \\\n    postgres:17</pre>Welke uitspraken zijn juist?",
 opts:["Met meerdere <code>-e</code>-opties geef je meerdere omgevingsvariabelen mee aan de container.","Welke variabelen je kan meegeven, is voor elke image hetzelfde, want ze zijn vastgelegd in Docker zelf.","Na dit commando bevat de image <code>postgres:17</code> deze waarden, zodat een nieuwe container ze ook krijgt zonder <code>-e</code>.","Om het wachtwoord later te wijzigen, volstaat <code>docker restart db</code> met een nieuwe <code>-e POSTGRES_PASSWORD</code>.","In de documentatie van de image (bv. op Docker Hub) lees je welke variabelen ze ondersteunt."],ok:[0,4],
 ex:["<code>-e</code> hoort bij de container; de image (read-only) verandert niet. Een variabele wijzigen = de container opnieuw aanmaken."]},
{id:"R5-18",topic:"t6",type:"mc",pts:1,
 q:"Op een server staat <code>python:3.13-slim</code> al lokaal. Een collega heeft <code>kdgstudent/api:1.0</code> gepusht:<pre>FROM python:3.13-slim\nCOPY requirements.txt /app/\nRUN pip install -r /app/requirements.txt\nCMD [\"python\", \"/app/main.py\"]</pre>Wat moet de server downloaden bij <code>docker pull kdgstudent/api:1.0</code>?",
 opts:["Alle lagen, ook die van <code>python:3.13-slim</code>, omdat het een andere image is.","Enkel de lagen die nog niet op de server staan: de lagen van COPY en RUN.","Niets, omdat de base image <code>python:3.13-slim</code> al lokaal staat.","Enkel een laag voor CMD, want COPY en RUN worden bij het pullen opnieuw uitgevoerd."],ok:[1],
 ex:["Enkel lagen die nog niet aanwezig zijn, worden gedownload. Bij een pull wordt niets uitgevoerd."]},
{id:"R5-19",topic:"t4",type:"multi",pts:2,
 q:"Een nieuw project, waarvan de images lokaal nog <b>niet</b> bestaan:<pre>services:\n  frontend:\n    image: example/webapp\n    build: ./webapp\n\n  backend:\n    image: example/database\n    build:\n      context: backend\n      dockerfile: ../backend.Dockerfile</pre>Welke uitspraken zijn juist?",
 opts:["Bij de eerste <code>docker compose up -d</code> worden beide images gebouwd, omdat ze lokaal nog niet bestaan.","De Dockerfile voor <code>backend</code> moet in de map <code>backend</code> staan en <code>Dockerfile</code> heten.","<code>build: ./webapp</code> betekent dat Compose de image <code>example/webapp</code> van Docker Hub haalt en in de map <code>./webapp</code> bewaart.","Na die eerste build bouwt elke volgende <code>docker compose up -d</code> automatisch opnieuw met de nieuwste broncode.","<code>image:</code> en <code>build:</code> mogen niet samen bij één service staan."],ok:[0],
 ex:["Compose bouwt bij <code>up</code> als de image lokaal niet gevonden wordt. <code>context</code> = map, <code>dockerfile</code> = welke Dockerfile; <code>image:</code> geeft het resultaat een naam."]},
{id:"R5-20",topic:"t2",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name web nginx:1.27</pre>Welke uitspraken zijn juist?",
 opts:["Door <code>-d</code> draait de container op de achtergrond en blijft je terminal vrij.","<code>docker exec -it web sh</code> opent een extra shell in de draaiende container <code>web</code>.","Typ je <code>exit</code> in die exec-shell, dan blijft nginx draaien en dus ook de container.","<code>docker exec web ls /usr/share/nginx/html</code> toont de bestanden in die map van de container <code>web</code>.","<code>docker run -it busybox</code> start een nieuwe container met een interactieve shell.","<code>docker exec -it nginx:1.27 sh</code> opent ook een shell in <code>web</code>, omdat <code>web</code> van die image komt."],ok:[0,1,2,3,4],
 ex:["<code>exec</code> voert eender welk commando uit in een draaiende container; <code>-it</code> heb je enkel nodig voor iets interactiefs zoals een shell. <code>exec</code> werkt op een container, niet op een image."]},
{id:"R6-1",topic:"t6",type:"multi",pts:2,
 q:"Op een server staat <code>python:3.13-slim</code> al lokaal, verder niets. Een collega pushte <code>kdgstudent/api:1.0</code> en <code>kdgstudent/worker:1.0</code>, die elk zo beginnen:<pre>FROM python:3.13-slim\nCOPY requirements.txt /app/\nRUN pip install -r /app/requirements.txt\nCMD [\"python\", \"/app/main.py\"]</pre>Je voert <code>docker pull kdgstudent/api:1.0</code> uit. Welke uitspraken zijn juist?",
 opts:["Bij het pullen wordt <code>pip install</code> op de server opnieuw uitgevoerd.","De lagen van <code>python:3.13-slim</code> worden niet opnieuw gedownload.","Pull je daarna ook <code>kdgstudent/worker:1.0</code>, dan staan de lagen van <code>python:3.13-slim</code> twee keer op de schijf: één keer per image.","Start je drie containers van <code>kdgstudent/api:1.0</code>, dan krijgt elke container een eigen read/write-laag bovenop dezelfde lagen van de image.","Docker herkent dat twee lagen dezelfde zijn aan de hash van de laag."],ok:[1,3,4],
 ex:["Bij een pull wordt niets uitgevoerd: <code>pip install</code> liep één keer bij <code>docker build</code>, het resultaat zit als laag in de image.","Enkel lagen die nog niet aanwezig zijn, worden gedownload. Lagen worden gedeeld op basis van hun hash."]},
{id:"R6-2",topic:"t5",type:"multi",pts:2,
 q:"Deze Dockerfile wordt gebouwd als <code>kdgstudent/app</code>:<pre>FROM alpine:3.20\nCMD [\"ping\", \"-c\", \"3\", \"localhost\"]</pre>Welke uitspraken zijn juist?",
 opts:["<code>docker run --rm kdgstudent/app</code> pingt 3 keer naar <code>localhost</code>.","<code>docker run --rm kdgstudent/app kdg.be</code> pingt 3 keer naar <code>kdg.be</code>, omdat <code>kdg.be</code> achter de CMD geplakt wordt.","<code>docker run --rm kdgstudent/app ping -c 1 kdg.be</code> pingt 1 keer naar <code>kdg.be</code>.","<code>docker run --rm -it kdgstudent/app sh</code> opent een shell in een nieuwe container.","Met <code>ENTRYPOINT [\"ping\", \"-c\", \"3\"]</code> en <code>CMD [\"localhost\"]</code> in de plaats zou <code>docker run --rm kdgstudent/app kdg.be</code> 3 keer naar <code>kdg.be</code> pingen."],ok:[0,2,3,4],
 ex:["Enkel een CMD: alles na de imagenaam vervangt de volledige CMD. <code>sh</code> vervangt dus het commando, en alpine heeft een shell.","Bij een ENTRYPOINT worden de argumenten erachter geplakt."]},
{id:"R6-3",topic:"t5",type:"multi",pts:2,
 q:"De mappen <code>/srv</code> en <code>/srv/web</code> bestaan nog niet in <code>node:22-alpine</code>. Gebouwd als <code>kdgstudent/web</code>:<pre>FROM node:22-alpine\nWORKDIR /srv\nCOPY package.json .\nRUN npm install\nWORKDIR web\nCOPY . .\nEXPOSE 8080\nCMD [\"node\", \"server.js\"]</pre>Welke uitspraken zijn juist?",
 opts:["<code>package.json</code> komt in de image terecht als <code>/srv/package.json</code>.","Bij het starten zoekt node <code>server.js</code> in de map <code>/web</code>.","<code>COPY . .</code> kopieert de bestanden naar <code>/srv/web</code>.","Na <code>docker run -d kdgstudent/web</code> is de app bereikbaar op poort 8080 van de host, dankzij <code>EXPOSE 8080</code>.","<code>docker run --rm kdgstudent/web pwd</code> toont <code>/srv/web</code>."],ok:[0,2,4],
 ex:["WORKDIR: absoluut, of relatief ten opzichte van de vorige. <code>web</code> wordt dus <code>/srv/web</code>, en dat is ook de werkmap bij het starten.","EXPOSE is documentatie; publiceren doe je met <code>-p</code>."]},
{id:"R6-4",topic:"t2",type:"multi",pts:2,
 q:"De Dockerfile van <code>kdgstudent/api:2.0</code> bevat <code>ENV LOG_LEVEL=warning</code>. Je start:<pre>$ docker run -d --name api -e LOG_LEVEL=info kdgstudent/api:2.0</pre>Welke uitspraken zijn juist?",
 opts:["In de container <code>api</code> heeft <code>LOG_LEVEL</code> de waarde <code>info</code>.","Start je daarna <code>docker run -d --name api2 kdgstudent/api:2.0</code>, dan heeft <code>LOG_LEVEL</code> in <code>api2</code> ook de waarde <code>info</code>.","Om <code>LOG_LEVEL</code> in <code>api</code> op <code>debug</code> te zetten, voer je <code>docker stop api</code> uit en daarna <code>docker start -e LOG_LEVEL=debug api</code>.","Wie de image <code>kdgstudent/api:2.0</code> heeft, kan de waarde <code>warning</code> lezen met <code>docker image inspect</code>.","Door de optie <code>-e</code> werd de image aangepast: <code>LOG_LEVEL=info</code> zit nu in de metadata van <code>kdgstudent/api:2.0</code>."],ok:[0,3],
 ex:["<code>-e</code> hoort bij de container; de image verandert niet. Een variabele wijzigen = de container opnieuw aanmaken."]},
{id:"R6-5",topic:"t3",type:"multi",pts:2,
 q:"De host heeft extern IP <code>192.168.121.199</code>. nginx luistert in de container op poort 80, de app in <code>kdgstudent/app</code> op poort 8080.<pre>$ docker run -d --name a -p 8080:80 nginx:latest\n$ docker run -d --name b -p 9090:8080 kdgstudent/app</pre>Beide commando's lukken. Welke uitspraken zijn juist?",
 opts:["Een client die naar <code>http://192.168.121.199:8080</code> surft, komt bij de nginx van container <code>a</code>.","Een derde container met <code>-p 8080:8080</code> lukt, omdat poort 8080 enkel binnen container <code>b</code> gebruikt wordt.","De Docker-daemon stuurt met een DNAT-regel het verkeer naar poort 9090 van de host door naar het interne IP van <code>b</code>, op poort 8080.","Om <code>b</code> bereikbaar te maken op poort 9090 van de host, had je <code>-p 8080:9090</code> moeten gebruiken.","Een client die naar <code>http://192.168.121.199:80</code> surft, komt ook bij de nginx van <code>a</code>, omdat nginx in de container op poort 80 luistert."],ok:[0,2],
 ex:["<code>-p HOST:CONTAINER</code>. Van buiten bereik je een container enkel via de gepubliceerde hostpoort (links van de dubbele punt). Hostpoort 8080 is al bezet door <code>a</code>."]},
{id:"R6-6",topic:"t4",type:"multi",pts:2,
 q:"Dit project draait al: bij de eerste <code>docker compose up -d</code> werden beide images gebouwd.<pre>services:\n  frontend:\n    image: example/webapp\n    build: ./webapp\n\n  backend:\n    image: example/database\n    build:\n      context: backend\n      dockerfile: ../backend.Dockerfile</pre>Je past de broncode in <code>./webapp</code> aan. Welke uitspraken zijn juist?",
 opts:["<code>docker compose up -d --build</code> bouwt de image opnieuw, zodat <code>frontend</code> met de nieuwe code draait.","<code>docker compose up -d</code> zonder <code>--build</code> gebruikt de bestaande lokale image <code>example/webapp</code>, dus je ziet je wijziging niet.","Na <code>docker compose down</code> en <code>docker rmi example/webapp</code> bouwt <code>docker compose up -d</code> die image opnieuw, omdat ze lokaal niet meer bestaat.","<code>docker compose restart frontend</code> toont de nieuwe code, omdat de container dan opnieuw opstart.","De image die voor <code>frontend</code> gebouwd wordt, krijgt de naam <code>example/webapp</code>."],ok:[0,1,2,4],
 ex:["Compose bouwt enkel als de image lokaal niet gevonden wordt, of met <code>--build</code>. <code>restart</code> herstart dezelfde container, gemaakt van de oude image."]},
{id:"R6-7",topic:"t1",type:"multi",pts:2,
 q:"Op een Linux-host voer je uit:<pre>root@host:~# chroot /srv/chroot/debian /bin/bash</pre>De map <code>/srv/chroot/debian</code> bevat een volledig Debian-bestandssysteem. Welke uitspraken zijn juist?",
 opts:["De bash ziet <code>/srv/chroot/debian</code> als zijn root-map <code>/</code>.","Door chroot krijgt de bash een eigen netwerkstack, gescheiden van die van de host.","De bash in de chroot draait op de kernel van de host.","Met cgroups bepaal je welke bestanden de bash kan zien.","Maakt de bash het bestand <code>/root/x.txt</code> aan, dan staat het op de host als <code>/srv/chroot/debian/root/x.txt</code>."],ok:[0,2,4],
 ex:["chroot verandert enkel wat het proces als <code>/</code> ziet; kernel, processen, netwerk en gebruikers blijven gedeeld.","cgroups = hoeveel een proces mag gebruiken (CPU, geheugen), niet wat het ziet."]},
{id:"R6-8",topic:"t1",type:"multi",pts:2,
 q:"Op een AlmaLinux-host met kernel <code>5.14.0</code> draaien twee containers, allebei gewoon gestart met <code>docker run</code>: <code>web</code> (van <code>nginx:1.27</code>, gebaseerd op Debian) en <code>db</code> (van <code>postgres:16</code>). Welke uitspraken zijn juist?",
 opts:["<code>docker exec web uname -r</code> toont <code>5.14.0-...</code>, de kernel van de host.","Elke container draait op een eigen kernel, die in zijn image zit.","Met namespaces beperk je <code>db</code> tot bv. 512 MB geheugen.","Een image die op Debian gebaseerd is, kan niet op een AlmaLinux-host draaien."],ok:[0],
 ex:["Alle containers delen de kernel van de host; een image bevat enkel bestanden. Geheugen beperken doe je met cgroups.","<b>Processen van andere containers:</b> standaard krijgt elke container zijn eigen namespaces, en dan ziet hij de processen van andere containers niet. Enkel als containers een namespace delen (zoals in een lab), zien ze elkaars processen wel."]},
{id:"R6-9",topic:"t1",type:"mc",pts:1,
 q:"Docker draait op een server. De nieuwe gebruiker <code>jan</code> krijgt:<pre>$ docker ps\npermission denied while trying to connect to the docker API at unix:///var/run/docker.sock\n\n$ ls -l /var/run/docker.sock\nsrw-rw---- 1 root docker 0 Nov  7 09:12 /var/run/docker.sock</pre>Welke uitspraak is juist?",
 opts:["<code>jan</code> moet eerst <code>docker login</code> uitvoeren; daarna krijgt hij toegang tot de socket.","De veiligste oplossing is <code>chmod 666 /var/run/docker.sock</code>.","<code>jan</code> zit niet in de groep <code>docker</code>. Voeg je hem toe, dan werkt het, maar dan krijgt hij in de praktijk root-rechten op de host.","Docker Hub weigert de verbinding, omdat <code>jan</code> daar geen account heeft."],ok:[2],
 ex:["De socket is van <code>root:docker</code>. <code>docker login</code> is voor een registry, niet voor de lokale socket."]},
{id:"R6-11",topic:"t2",type:"multi",pts:2,
 q:"<pre>$ docker images\nREPOSITORY       TAG      IMAGE ID       SIZE\nkdgstudent/mvc   1.0      a1b2c3d4e5f6   220MB\nkdgstudent/mvc   latest   a1b2c3d4e5f6   220MB</pre>Een collega pusht vandaag een nieuwe versie naar Docker Hub als <code>kdgstudent/mvc:latest</code>. Lokaal heb je nog niets gedaan. Welke uitspraken zijn juist?",
 opts:["<code>1.0</code> en <code>latest</code> zijn één image met twee labels; ze nemen samen ongeveer 220 MB in.","<code>docker run -d kdgstudent/mvc</code> start nu automatisch de nieuwe versie van je collega.","Na <code>docker pull kdgstudent/mvc</code> wijst <code>latest</code> naar een nieuw IMAGE ID, en <code>1.0</code> nog naar <code>a1b2c3d4e5f6</code>.","Voer je nu <code>docker rmi kdgstudent/mvc:1.0</code> uit, dan wordt enkel het label weggehaald (<i>Untagged</i>), omdat <code>latest</code> nog naar dezelfde image wijst.","<code>docker pull kdgstudent/mvc</code> en <code>docker pull docker.io/kdgstudent/mvc:latest</code> doen hetzelfde."],ok:[0,2,3,4],
 ex:["<code>docker run</code> downloadt niet opnieuw als de image lokaal bestaat; <code>latest</code> verschuift pas bij <code>docker pull</code>."]},
{id:"R6-12",topic:"t6",type:"mc",pts:1,
 q:"Een server ruimt elke nacht op met <code>docker system prune -af --filter \"until=168h\"</code>. Wat blijft daarbij gegarandeerd staan, ook als het ouder is dan 7 dagen?",
 opts:["De build cache","Gestopte containers","Images die door geen enkele container gebruikt worden","Volumes"],ok:[3],
 ex:["Cursus: alles ouder dan 7 dagen wordt verwijderd, behalve volumes."]},
{id:"R6-13",topic:"t7",type:"multi",pts:2,
 q:"Je Docker Hub-account heet <code>kdgstudent</code>, maar je maakte een typfout:<pre>$ docker build -t kdgstudnet/webapp:1.0 .\n$ docker tag kdgstudnet/webapp:1.0 kdgstudent/webapp:1.0</pre>Welke uitspraken zijn juist?",
 opts:["<code>docker images</code> toont nu twee regels met hetzelfde IMAGE ID.","<code>docker tag</code> heeft de image hernoemd: <code>kdgstudnet/webapp:1.0</code> bestaat niet meer.","De image neemt nu twee keer zoveel schijfruimte in.","<code>docker push kdgstudent/webapp:1.0</code> pusht ook automatisch een tag <code>latest</code>.","Ben je niet ingelogd met <code>docker login</code>, dan wordt <code>docker push kdgstudent/webapp:1.0</code> geweigerd."],ok:[0,4],
 ex:["<code>docker tag</code> hangt een extra label aan dezelfde image: geen kopie, geen hernoeming. Je pusht per tag."]},
{id:"R6-14",topic:"t6",type:"mc",pts:1,
 q:"<pre>FROM python:3.13-slim\nENV APP_ENV=prod\nCOPY requirements.txt /app/\nRUN pip install -r /app/requirements.txt\nEXPOSE 8000\nCMD [\"python\", \"/app/main.py\"]</pre>Hoeveel <b>nieuwe</b> lagen voegt deze Dockerfile toe bovenop <code>python:3.13-slim</code>?",
 opts:["1","2","3","6"],ok:[1],
 ex:["Enkel RUN, COPY en ADD maken lagen. ENV, EXPOSE en CMD zijn metadata."]},
{id:"R6-15",topic:"t3",type:"fill",pts:2,
 q:"Een Flask-app luistert in de container op poort <b>5000</b>. Poort 80 en 8080 van de host zijn al bezet. De app moet bereikbaar zijn via <code>http://&lt;host&gt;:8081</code>. Vul aan:<pre>docker run -d -p __________ kdgstudent/flask:1.0</pre>",
 accept:["8081:5000","-p 8081:5000","0.0.0.0:8081:5000","-p 0.0.0.0:8081:5000"],answer:"<code>8081:5000</code>",
