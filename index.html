<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Docker – interactief oefenexamen</title>
  <meta name="description" content="Gratis interactief oefenexamen voor Computersystemen 2 – Docker (KdG).">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>CS2 Docker – oefenexamen <small class="version" id="version"></small></h1>
      <p class="score" id="score" role="status"></p>
    </header>

    <div class="toolbar" id="toolbar" hidden>
      <button class="btn btn-small" type="button" id="new-exam">Nieuw examen</button>
    </div>

    <nav class="question-nav" id="question-nav" aria-label="Vragen" hidden>
      <ol id="question-grid"></ol>
    </nav>

    <main id="main">
      <!-- Replaced as soon as the app starts. It stays visible without JavaScript or when index.html is opened straight from disk (file://). -->
      <p class="card">Bezig met laden… Blijft deze melding staan? Zet JavaScript aan en open de oefenpagina via <a href="https://sugarnomilk.github.io/KdG-ComputerSystems-Docker/">de website</a> of via een lokale server (bv. <code>python3 -m http.server</code>). Dubbelklikken op <code>index.html</code> werkt niet.</p>
    </main>
  </div>

  <!-- Start screen -->
  <template id="tpl-start">
    <section class="card" aria-labelledby="start-title">
      <h2 id="start-title">Nieuw oefenexamen</h2>
      <p class="card-lead">Kies hoeveel vragen je wil. Je krijgt een willekeurige selectie uit minstens <span data-field="pool-size"></span> vragen. Er worden doorlopend vragen bijgevoegd tot en met de examendatum. Vragen zijn verdeeld over alle onderdelen van de cursus: elk onderdeel komt minstens één keer aan bod.</p>

      <label class="label-strong" for="count-range">Aantal vragen: <output for="count-range" data-field="count"></output></label>
      <input class="range" type="range" id="count-range" step="1">
      <div class="actions" data-field="presets"></div>

      <fieldset class="mode-picker">
        <legend class="label-strong">Soort examen</legend>
        <label class="option">
          <input type="radio" name="mode" value="smart">
          <span class="option-text"><strong>Slim</strong>: begrippen die je miste en vragen die je nooit zag, komen eerst. Een begrip is afgerond zodra je twee vragen ervan volledig juist hebt; elk onderdeel komt toch altijd aan bod.</span>
        </label>
        <label class="option">
          <input type="radio" name="mode" value="random">
          <span class="option-text"><strong>Rando</strong>: een willekeurige selectie uit de hele pool. Je resultaten tellen mee voor Slim.</span>
        </label>
      </fieldset>

      <h3>Onderdelen</h3>
      <ul class="summary-list" data-field="topics"></ul>
      <p class="hint" data-field="progress"></p>

      <div class="actions">
        <button class="btn btn-primary" type="button" data-action="start">Start examen</button>
        <button class="btn" type="button" data-action="reset-history">Wis geschiedenis</button>
        <button class="btn" type="button" data-action="resume" hidden>Verder met vorig examen (<span data-field="resume-count"></span> vragen)</button>
      </div>

      <section class="hint scoring-info" aria-labelledby="scoring-title">
        <h3 id="scoring-title">Puntentelling</h3>
        <ul>
          <li>Meerkeuze (één antwoord): 1 punt. Juist = 1, fout = 0.</li>
          <li>Invulvraag: 2 punten. Juist = 2, fout = 0.</li>
          <li>Meerdere antwoorden: 2 punten. Elke juiste optie die je aanduidt is 2 ÷ (aantal juiste opties) waard; elke foute optie die je aanduidt trekt evenveel af. Niet gokken dus. Een vraag geeft nooit minder dan 0.</li>
        </ul>
        <p>Voorbeeld: 2 juiste opties, je duidt er één juiste en één foute aan → 1 − 1 = 0 punten.</p>
        <p>Alles wordt automatisch verbeterd. Bij invulvragen maken hoofdletters, spaties, aanhalingstekens en een punt op het einde niets uit.</p>
      </section>
      <section class="hint scoring-info" aria-labelledby="privacy-title">
        <h3 id="privacy-title">Privacy</h3>
        <p>Je voortgang en je geschiedenis per vraag blijven enkel in je eigen browser; er wordt niets doorgestuurd. Herlaad de pagina voor de nieuwste vragen.</p>
      </section>
    </section>
  </template>

  <!-- Question screen -->
  <template id="tpl-question">
    <article class="card" data-field="card">
      <ul class="meta">
        <li class="tag" data-field="number"></li>
        <li data-field="kind"></li>
        <li class="tag tag-topic" data-field="topic"></li>
      </ul>

      <div class="question-text" id="question-text" data-field="text"></div>
      <p class="hint" data-field="multi-hint" hidden>(meerdere antwoorden mogelijk)</p>

      <fieldset class="answer-options" data-field="options" aria-labelledby="question-text" hidden>
        <legend class="visually-hidden">Antwoordopties</legend>
      </fieldset>

      <div data-field="fill" hidden>
        <label class="visually-hidden" for="fill-input">Jouw antwoord</label>
        <input type="text" id="fill-input" autocomplete="off" spellcheck="false" placeholder="Jouw antwoord">
      </div>

      <div data-field="open" hidden>
        <label class="visually-hidden" for="open-input">Jouw antwoord</label>
        <textarea id="open-input" placeholder="Schrijf je antwoord (2 à 3 zinnen)"></textarea>
        <p class="hint">Na bevestigen zie je het modelantwoord en beoordeel je jezelf.</p>
      </div>

      <p class="field-error" data-field="error" role="alert"></p>
      <div data-field="feedback"></div>
      <div class="actions">
        <button class="btn btn-primary" type="button" data-action="confirm">Bevestig</button>
      </div>

      <p class="hint source">Bron: <span data-field="source"></span> · <a class="report-link" data-field="report" target="_blank" rel="noopener">⚑ Meld een fout</a></p>
    </article>

    <nav class="pager" aria-label="Vorige en volgende vraag">
      <button class="btn" type="button" data-action="prev">← Vorige</button>
      <button class="btn" type="button" data-action="next">Volgende →</button>
    </nav>
  </template>

  <template id="tpl-option">
    <label class="option">
      <input name="answer">
      <span class="option-letter"></span>
      <span class="option-text"></span>
    </label>
  </template>

  <!-- Feedback after a closed question -->
  <template id="tpl-result">
    <section class="result" aria-live="polite">
      <h3 data-field="title"></h3>
      <p class="result-answer">Juist antwoord: <span data-field="answer"></span></p>
      <ul data-field="explanation"></ul>
    </section>
  </template>

  <!-- Feedback after an open question -->
  <template id="tpl-result-open">
    <section class="result" aria-live="polite">
      <h3>Modelantwoord</h3>
      <ul data-field="model"></ul>
      <div class="self-assess" data-field="self-assess">
        <span class="hint">Hoe goed was jouw antwoord?</span>
        <button class="btn" type="button"></button>
        <button class="btn" type="button"></button>
        <button class="btn" type="button"></button>
      </div>
      <p class="hint" data-field="self-verdict" hidden></p>
    </section>
  </template>

  <!-- Result screen -->
  <template id="tpl-end">
    <section class="card" aria-labelledby="end-title">
      <h2 id="end-title">Resultaat</h2>
      <p class="end-score" data-field="score"></p>
      <div class="bar" role="progressbar" aria-label="Score" aria-valuemin="0" aria-valuemax="100" data-field="bar">
        <span class="bar-fill" data-field="bar-fill"></span>
      </div>
      <p data-field="percentage"></p>

      <h3>Per onderdeel</h3>
      <ul class="summary-list" data-field="by-topic"></ul>

      <h3>Per vraag</h3>
      <ul class="summary-list" data-field="by-question"></ul>

      <h3>Resultaat bewaren</h3>
      <p class="hint">Kopieer je resultaat als je het wil bijhouden, bv. in je notities of om er later met AI of een medestudent je fouten mee te bespreken.</p>
      <label class="visually-hidden" for="report">Resultaat als tekst</label>
      <textarea class="report" id="report" readonly></textarea>
      <div class="actions">
        <button class="btn" type="button" data-action="copy">Kopieer resultaat</button>
        <button class="btn btn-primary" type="button" data-action="again">Nieuw examen</button>
        <span class="hint" data-field="copied" role="status"></span>
      </div>
    </section>
  </template>

  <!-- Shown when data/*.json cannot be loaded -->
  <template id="tpl-load-error">
    <section class="card" role="alert">
      <h2>De vragen konden niet geladen worden</h2>
      <p>Open de oefenpagina via <a href="https://sugarnomilk.github.io/KdG-ComputerSystems-Docker/">de website</a>. Lokaal werkt dubbelklikken op <code>index.html</code> niet; start een lokale server (bv. <code>python3 -m http.server</code>) en open <code>http://localhost:8000</code>.</p>
    </section>
  </template>
</body>
</html>
