{id:"R6-16",topic:"t4",type:"multi",pts:2,
 q:"Een Compose-project met de services <code>web</code> en <code>db</code> draait met <code>docker compose up -d</code>. <code>db</code> bewaart zijn data in het named volume <code>dbdata</code>. Welke uitspraken zijn juist?",
 opts:["Wijzig je de poort van <code>web</code> in <code>docker-compose.yml</code>, dan volstaat <code>docker compose restart web</code> om de nieuwe poort te gebruiken.","Na een wijziging in <code>docker-compose.yml</code> maakt <code>docker compose up -d</code> enkel de containers met een gewijzigde configuratie opnieuw aan.","<code>docker compose down</code> verwijdert ook het volume <code>dbdata</code>.","<code>docker compose down -v</code> verwijdert ook het volume <code>dbdata</code>, en dus de data van de databank.","<code>docker compose stop</code> verwijdert de containers, maar laat het volume staan."],ok:[1,3],
 ex:["Configuratie ligt vast bij het aanmaken van een container: <code>up -d</code> maakt hem opnieuw aan, <code>restart</code> niet.","<code>stop</code> verwijdert niets; <code>down</code> verwijdert containers en netwerk; <code>down -v</code> ook de volumes."]},
{id:"R6-17",topic:"t6",type:"multi",pts:2,
 q:"Twee images werden publiek naar Docker Hub gepusht. Hun Dockerfiles bevatten:<pre>image 1:  COPY id_rsa /tmp/id_rsa\n          RUN rm /tmp/id_rsa\nimage 2:  ENV API_KEY=sk-12345geheim</pre>Welke uitspraken zijn juist?",
 opts:["In een container van image 1 vind je <code>/tmp/id_rsa</code> niet, maar de sleutel zit nog in een onderliggende laag.","Door de <code>RUN rm</code>-regel is image 1 kleiner geworden.","ENV maakt geen bestandslaag, dus wie image 2 heeft, kan <code>API_KEY</code> niet zien.","Je trekt beide sleutels best in en vervangt ze, want de gepushte images blijven ze bevatten.","Geheimen geef je beter pas bij het opstarten mee, bv. via een bind mount of Compose secrets."],ok:[0,3,4],
 ex:["Verwijderde bestanden blijven in de onderliggende laag (secrets!), en de image wordt niet kleiner. ENV-waarden zitten in de metadata van de image."]},
{id:"R6-18",topic:"t2",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name web nginx:1.27\n$ docker exec web touch /tmp/test.txt\n$ docker stop web\n$ docker start web</pre>Welke uitspraken zijn juist?",
 opts:["Na <code>docker start web</code> staat <code>/tmp/test.txt</code> nog in de container.","<code>docker start web</code> maakt een nieuwe container aan vanuit de image <code>nginx:1.27</code>.","Doe je daarna <code>docker rm -f web</code> en opnieuw <code>docker run -d --name web nginx:1.27</code>, dan is <code>/tmp/test.txt</code> weg.","Bij <code>docker start web</code> worden de RUN-instructies uit de Dockerfile van nginx opnieuw uitgevoerd."],ok:[0,2],
 ex:["De read/write-laag blijft bewaard zolang de container gestopt is, en verdwijnt bij <code>docker rm</code>. RUN gebeurt enkel bij <code>docker build</code>."]},
{id:"R6-19",topic:"t7",type:"multi",pts:2,
 q:"Je bent op Docker Hub ingelogd als <code>kdgstudent</code>.<pre>$ docker build -t shop:1.0 .\n$ docker push shop:1.0\ndenied: requested access to the resource is denied</pre>Welke uitspraken zijn juist?",
 opts:["Docker probeerde naar <code>docker.io</code> te pushen, omdat er geen registry vooraan in de naam staat.","Opnieuw <code>docker login</code> uitvoeren lost het probleem op.","<code>docker tag shop:1.0 kdgstudent/shop:1.0</code> en daarna <code>docker push kdgstudent/shop:1.0</code> lost het op, zonder opnieuw te bouwen.","Wil je naar een eigen registry op poort 5000 van deze host pushen, dan tag je de image als <code>localhost:5000/shop:1.0</code>.","Na <code>docker tag</code> staan er twee volledige kopieën van de image op je schijf."],ok:[0,2,3],
 ex:["Zonder registry in de naam = <code>docker.io</code>, en daar mag je enkel onder je eigen account pushen. Opnieuw taggen volstaat."]},
{id:"R6-20",topic:"t3",type:"multi",pts:2,
 q:"Je start <code>docker run -d --name app -v notes:/data kdgstudent/notes:1.0</code>. Er bestond vooraf geen volume <code>notes</code>. De app bewaart enkele notities in <code>/data</code>. Welke uitspraken zijn juist?",
 opts:["Docker maakt het named volume <code>notes</code> automatisch aan.","<code>docker rm -f app</code> verwijdert ook het volume <code>notes</code>.","Een nieuwe container <code>app2</code> met <code>-v notes:/data</code> ziet dezelfde notities, ook nadat <code>app</code> verwijderd is.","<code>docker volume inspect app</code> toont waar de notities opgeslagen zijn.","Omdat <code>app2</code> een andere containernaam heeft, krijgt hij een nieuw, leeg volume."],ok:[0,2],
 ex:["Een named volume leeft los van containers en wordt gevonden op zijn naam; de containernaam speelt geen rol.","<code>docker volume inspect</code> verwacht een volumenaam (<code>notes</code>), geen containernaam."]},
{id:"R6-22",topic:"t6",type:"multi",pts:2,
 q:"Gebouwd met één commando: <code>docker build -t kdgstudent/tool:1.0 .</code><pre>FROM golang:1.23 AS build\nCOPY main.go /src/\nRUN go build -o /app /src/main.go\n\nFROM alpine:3.20\nCOPY --from=build /app /app\nCMD [\"/app\"]</pre>Welke uitspraken over de image <code>kdgstudent/tool:1.0</code> zijn juist?",
 opts:["De image bevat de Go-compiler uit <code>golang:1.23</code>.","De image bevat de broncode <code>/src/main.go</code>.","De image is kleiner dan wanneer je alles in één stage op basis van <code>golang:1.23</code> zou bouwen.","Dat ene <code>docker build</code>-commando voert beide stages uit.","<code>COPY --from=build</code> neemt enkel het gecompileerde programma <code>/app</code> over uit de eerste stage."],ok:[2,3,4],
 ex:["Elke FROM start een nieuwe, lege stage. In de eindimage zit enkel de laatste stage plus wat je met <code>COPY --from</code> overneemt."]},
{id:"R6-23",topic:"t4",type:"fill",pts:2,
 q:"Je Compose-project met de services <code>web</code>, <code>api</code> en <code>db</code> draait op de achtergrond. Je staat in de map met <code>docker-compose.yml</code>. Met welk volledig commando volg je de output van <b>alle</b> services live mee?",
 accept:["docker compose logs -f","docker compose logs --follow","docker-compose logs -f","docker-compose logs --follow","compose logs -f"],answer:"<code>docker compose logs -f</code>",
 ex:["<code>docker logs</code> verwacht een containernaam; Compose leest zelf <code>docker-compose.yml</code> in de huidige map."]},
{id:"R6-24",topic:"t2",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name job alpine:3.20 echo klaar\n$ docker run -d --name web nginx:1.27</pre>Een minuut later: welke uitspraken zijn juist?",
 opts:["<code>job</code> staat niet meer in <code>docker ps</code>, maar wel in <code>docker ps -a</code> als <code>Exited (0)</code>.","Door <code>-d</code> blijven beide containers draaien tot je ze zelf stopt.","<code>docker exec web ls /etc</code> toont de bestanden in <code>/etc</code> van <code>web</code>, ook zonder <code>-it</code>.","<code>docker exec -it job sh</code> opent een shell in <code>job</code>.","<code>docker exec -it nginx:1.27 sh</code> opent een shell in <code>web</code>."],ok:[0,2],
 ex:["<code>-d</code> = achtergrond, niet \"blijf draaien\". <code>exec</code> werkt enkel op een draaiende container (naam of ID, geen image); <code>-it</code> enkel voor iets interactiefs."]},
{id:"R6-25",topic:"t6",type:"multi",pts:2,
 q:"<pre>FROM node:22-alpine\nWORKDIR /app\nCOPY package.json .\nRUN npm install\nCOPY . .\nCMD [\"node\", \"server.js\"]</pre>Alles staat in de build cache. Welke uitspraken zijn juist?",
 opts:["Wijzig je enkel <code>server.js</code> en bouw je opnieuw, dan komt <code>npm install</code> uit de cache.","Wijzig je <code>package.json</code>, dan worden <code>npm install</code> en alle stappen erna opnieuw uitgevoerd.","Met <code>docker build --no-cache</code> wordt enkel <code>COPY . .</code> opnieuw uitgevoerd.","<code>npm install</code> wordt uitgevoerd telkens je een container van deze image start.","<code>package.json</code> wordt apart en eerst gekopieerd, zodat een wijziging aan enkel <code>server.js</code> geen nieuwe <code>npm install</code> veroorzaakt."],ok:[0,1,4],
 ex:["Wijzigt een regel (of een gekopieerd bestand), dan worden die regel en alles erna opnieuw uitgevoerd. <code>--no-cache</code> voert alles opnieuw uit. RUN gebeurt bij <code>docker build</code>."]},
{id:"R6-26",topic:"t2",type:"multi",pts:2,
 q:"Je start <code>docker run -d --rm --name api kdgstudent/api:2.0</code>. De app crasht meteen bij het opstarten. Welke uitspraken zijn juist?",
 opts:["Met <code>docker logs api</code> zie je nog waarom de app crashte.","Start je de app opnieuw zonder <code>--rm</code>, dan kan je de fout daarna bekijken met <code>docker logs api</code>.","<code>docker logs kdgstudent/api:2.0</code> toont de output van de gecrashte app.","<code>docker history kdgstudent/api:2.0</code> toont de lagen en instructies van de image.","De logs van een container worden in zijn image bewaard."],ok:[1,3],
 ex:["Met <code>--rm</code> verdwijnt de container, en dus ook zijn logs, zodra hij stopt. <code>logs</code> werkt op een container, <code>history</code> op een image."]},
{id:"R6-27",topic:"t4",type:"fill",pts:2,
 q:"<pre>services:\n  api:\n    image: kdgstudent/api:3.0\n    build: ./api</pre>Het project draait al. Je hebt de code in <code>./api</code> aangepast. Met welk volledig commando wordt de image opnieuw gebouwd en draait <code>api</code> daarna met de nieuwe code, op de achtergrond?",
 accept:["docker compose up -d --build","docker compose up --build -d","docker compose up -d --build api","docker compose up --build -d api","docker-compose up -d --build","docker-compose up --build -d","docker compose up --detach --build","docker compose up --build --detach"],answer:"<code>docker compose up -d --build</code>",
 ex:["Zonder <code>--build</code> gebruikt Compose de bestaande lokale image; zonder <code>-d</code> blijft <code>up</code> op de voorgrond."]},
{id:"R6-28",topic:"t5",type:"multi",pts:2,
 q:"Welke uitspraken over Dockerfile-instructies zijn juist?",
 opts:["<code>EXPOSE 80</code> publiceert poort 80 op de host bij <code>docker run</code>.","Staan er twee CMD-instructies in een Dockerfile, dan wordt enkel de laatste gebruikt.","Een LABEL-instructie voegt een nieuwe bestandssysteemlaag toe aan de image.","Met <code>RUN date &gt; /build.txt</code> en <code>CMD [\"cat\", \"/build.txt\"]</code> toont elke <code>docker run</code> het tijdstip waarop de image gebouwd werd.","Een waarde die je met <code>ENV</code> zet, kan je bij <code>docker run</code> overschrijven met <code>-e</code>."],ok:[1,3,4],
 ex:["EXPOSE is documentatie, LABEL is metadata. RUN gebeurt één keer bij <code>docker build</code>, CMD bij elke start."]},
{id:"R6-30",topic:"t7",type:"fill",pts:2,
 q:"<pre>$ docker ps -a\nCONTAINER ID   IMAGE                                STATUS                     NAMES\n3fa91c0d22e1   localhost:5000/kdgstudent/blog:2.1   Exited (0) 9 hours ago     blog</pre>De host werd vannacht herstart. Met welk volledig commando start je deze <b>bestaande</b> container opnieuw, zonder een nieuwe aan te maken?",
 accept:["docker start blog","docker container start blog","docker start 3fa91c0d22e1","docker start 3fa9","docker start 3fa91c0d","docker container start 3fa91c0d22e1"],answer:"<code>docker start blog</code>",
 ex:["<code>start</code> krijgt de containernaam (kolom NAMES) of het container ID, niet de imagenaam."]},
{id:"R7-1",topic:"t1",type:"multi",pts:2,
 q:"Een bedrijf verhuist zijn applicaties van virtuele machines naar Docker-containers op één Linux-host. De security officer is bezorgd. Welke uitspraken zijn juist?",
 opts:["Wordt een kernelkwetsbaarheid vanuit één container misbruikt, dan kan een aanvaller ook de host en de andere containers treffen.","Containers zijn trager dan VM's, omdat Docker een emulatielaag voor de hardware toevoegt.","Bij VM's is dat kernelrisico kleiner, omdat elke VM een eigen kernel heeft bovenop een hypervisor.","Elke container krijgt een eigen kopie van de kernel, zodat een lek beperkt blijft tot die ene container.","Een app die op de laptop van de ontwikkelaar werkt, start in een container op de server vaak niet, omdat de image de systeembibliotheken van de laptop mist."],ok:[0,2],
 ex:["Er is één gedeelde kernel: een lek erin raakt de host en alle containers. Een VM heeft een eigen kernel.","Ontbrekende bibliotheken zijn net wat containers oplossen: de image bevat ze."]},
{id:"R7-2",topic:"t1",type:"multi",pts:2,
 q:"Welke uitspraken over hoe containers op Linux werken zijn juist?",
 opts:["Met cgroups beperk je hoeveel CPU en geheugen een container mag gebruiken.","Een proces in een chroot kan geen paden buiten zijn nieuwe root bereiken, dus chroot alleen volstaat om het volledig te isoleren.","Docker gebruikt een hypervisor om containers te starten.","Namespaces bepalen wat een proces ziet, bv. welke processen en welk netwerk.","Alle containers op dezelfde host delen de kernel van de host."],ok:[0,3,4],
 ex:["chroot verandert enkel de bestandsweergave; namespaces en cgroups voegen de echte isolatie toe. Geen hypervisor, één gedeelde kernel.","<b>Processen van andere containers:</b> standaard krijgt elke container zijn eigen namespaces, en dan ziet hij de processen van andere containers niet. Enkel als containers een namespace delen (zoals in een lab), zien ze elkaars processen wel."]},
{id:"R7-3",topic:"t1",type:"multi",pts:2,
 q:"Welke uitspraken over containers in de praktijk zijn juist?",
 opts:["Op één host kunnen tientallen tot honderden containers tegelijk draaien.","Microservices draaien vaak in containers die over meerdere machines verspreid zijn.","Images zijn gestandaardiseerd (OCI), dus ze werken ook met andere tools zoals Podman.","Containers zijn handig voor ontwikkeling en testen; in productie gebruik je best VM's.","Een container start doorgaans in seconden, omdat er geen besturingssysteem met eigen kernel moet opstarten."],ok:[0,1,2,4],
 ex:["Containers worden ook op grote schaal in productie gebruikt."]},
{id:"R7-4",topic:"t3",type:"multi",pts:2,
 q:"De webserver <code>httpd</code> luistert in de container op poort 80. Je voert na elkaar uit:<pre>$ docker run -d --name w1 httpd\n$ docker run -d --name w2 httpd\n$ docker run -d --name w3 -p 80:80 httpd\n$ docker run -d --name w4 -p 80:80 httpd</pre>Welke uitspraken zijn juist?",
 opts:["<code>w1</code> en <code>w2</code> starten allebei, ook al luisteren ze allebei op poort 80 in hun container.","<code>w2</code> faalt, omdat poort 80 al in gebruik is door <code>w1</code>.","<code>w4</code> faalt, omdat poort 80 op de host al gepubliceerd is door <code>w3</code>.","<code>w4</code> faalt, omdat je van eenzelfde image maar één container met een gepubliceerde poort kan starten.","Met <code>-p 8080:80</code> in plaats van <code>-p 80:80</code> zou <code>w4</code> wel starten."],ok:[0,2,4],
 ex:["Elke container heeft een eigen netwerk; een hostpoort kan maar één keer gepubliceerd worden."]},
{id:"R7-5",topic:"t3",type:"multi",pts:2,
 q:"Op de host bestaat de map <code>/data/shared</code>.<pre>$ docker run -d --name a -v /data/shared:/app/output kdgstudent/rapport\n$ docker run -d --name b -v /data/shared:/var/log/app kdgstudent/viewer\n$ docker run -d --name c -v shared:/app/output kdgstudent/rapport</pre>De app in <code>a</code> schrijft het bestand <code>/app/output/rapport.pdf</code>. Welke uitspraken zijn juist?",
 opts:["<code>b</code> ziet het bestand meteen als <code>/var/log/app/rapport.pdf</code>.","<code>c</code> ziet het bestand ook in <code>/app/output</code>, omdat <code>c</code> hetzelfde containerpad gebruikt als <code>a</code>.","Na <code>docker rm -f a b</code> staat <code>rapport.pdf</code> nog op de host in <code>/data/shared</code>.","<code>b</code> ziet het bestand pas na een herstart van <code>b</code>.","Het bestand wordt niet gedeeld, omdat de paden in <code>a</code> en <code>b</code> verschillen."],ok:[0,2],
 ex:["Een bind mount is live en gedeeld, ook met verschillende paden in de containers. <code>shared</code> zonder <code>/</code> is een naam: een apart named volume."]},
{id:"R7-6",topic:"t4",type:"multi",pts:2,
 q:"In je <code>docker-compose.yml</code> staat:<pre>    environment:\n      POSTGRES_PASSWORD: ${DB_PASSWORD}</pre>Welke uitspraken zijn juist?",
 opts:["Zet je <code>DB_PASSWORD=geheim</code> in een bestand <code>.env</code> in dezelfde map, dan vult <code>docker compose up</code> de waarde automatisch in.","Staat <code>.env</code> in <code>.dockerignore</code>, dan kan Compose <code>${DB_PASSWORD}</code> niet meer invullen.","<code>.env</code> zet je best in <code>.gitignore</code>, zodat het wachtwoord niet in je Git-repository terechtkomt.","Kopieert een <code>COPY . .</code> het bestand <code>.env</code> in een image die je daarna pusht, dan raak je het wachtwoord niet meer kwijt uit die image.","Docker kopieert <code>.env</code> nooit mee in een image, ook niet zonder <code>.dockerignore</code>."],ok:[0,2,3],
 ex:["<code>.dockerignore</code> = uit de image, <code>.gitignore</code> = uit Git. Compose leest <code>.env</code> uit de projectmap, los van <code>.dockerignore</code>."]},
{id:"R7-7",topic:"t4",type:"multi",pts:2,
 q:"<pre>services:\n  data:\n    image: mysql:8\n    restart: always\n  wordpress:\n    image: wordpress\n    depends_on:\n      - data\n    environment:\n      WORDPRESS_DB_HOST: wordpress\nvolumes:\n  db_data: {}</pre>WordPress vindt de databank niet, en na <code>docker compose down</code> en <code>up -d</code> is de databank leeg. Welke uitspraken zijn juist?",
 opts:["<code>WORDPRESS_DB_HOST</code> verwijst naar WordPress zelf; het moet de databankservice zijn: <code>data</code>.","Door <code>volumes: db_data: {}</code> wordt het volume automatisch aan alle services gekoppeld.","De databank is leeg omdat <code>db_data</code> wel gedeclareerd is, maar door geen enkele service gemount wordt.","Een oplossing is bij <code>data</code> toevoegen: <code>volumes: - db_data:/var/lib/mysql</code>.","Door <code>restart: always</code> blijft de data van <code>data</code> bewaard na <code>docker compose down</code>."],ok:[0,2,3],
 ex:["Bovenaan onder <code>volumes:</code> declareer je een volume enkel; een service gebruikt het pas als het bij die service gemount wordt."]},
{id:"R7-8",topic:"t4",type:"multi",pts:2,
 q:"Je staat in de map met een <code>docker-compose.yml</code> met de services <code>web</code> en <code>db</code>; <code>db</code> gebruikt het named volume <code>dbdata</code>. Het project draaide nog nooit. Welke uitspraken zijn juist?",
 opts:["<code>docker compose up -d</code> maakt de containers aan en start alle services op de achtergrond.","<code>docker compose start</code> maakt de containers aan als ze nog niet bestaan.","<code>docker compose down</code> verwijdert de containers en het netwerk van het project, maar het volume <code>dbdata</code> blijft bestaan.","Na <code>docker compose stop</code> bestaan de containers nog, en <code>docker compose start</code> start ze weer op.","<code>docker compose down</code> verwijdert ook de images van <code>web</code> en <code>db</code>."],ok:[0,2,3],
 ex:["<code>start</code> start enkel services die al aangemaakt zijn. <code>down</code> laat volumes en images staan."]},
{id:"R7-9",topic:"t5",type:"multi",pts:2,
 q:"Twee images, allebei gebaseerd op <code>alpine:3.20</code>:<pre>img-a:  CMD [\"echo\", \"hallo\"]\nimg-b:  ENTRYPOINT [\"echo\", \"hallo\"]</pre>Welke uitspraken zijn juist?",
 opts:["<code>docker run --rm img-a wereld</code> geeft een fout: Docker probeert een programma <code>wereld</code> te starten.","<code>docker run --rm img-b wereld</code> toont <code>hallo wereld</code>.","<code>docker run --rm -it img-a sh</code> opent een shell.","<code>docker run --rm -it img-b sh</code> opent een shell.","ENTRYPOINT kies je wanneer de image altijd hetzelfde programma start, bv. een CLI-tool."],ok:[0,1,2,4],
 ex:["CMD: argumenten vervangen het commando. ENTRYPOINT: argumenten worden erachter geplakt (<code>hallo sh</code>, geen shell)."]},
{id:"R7-10",topic:"t5",type:"multi",pts:2,
 q:"Welke uitspraken over de instructies RUN en WORKDIR zijn juist?",
 opts:["RUN mag meerdere keren in een Dockerfile staan; een volgende RUN overschrijft de vorige niet.","RUN wordt uitgevoerd telkens er een container van de image start.","Elke RUN-instructie voegt een nieuwe laag toe aan de image.","WORKDIR stelt de werkmap in voor alle volgende RUN-, COPY-, CMD- en ENTRYPOINT-instructies.","Na <code>WORKDIR /app</code> en daarna <code>WORKDIR src</code> is de werkmap <code>/src</code>."],ok:[0,2,3],
 ex:["RUN gebeurt bij <code>docker build</code>. Een relatieve WORKDIR geldt ten opzichte van de vorige: <code>/app/src</code>."]},
{id:"R7-11",topic:"t7",type:"multi",pts:2,
 q:"Je hebt lokaal <code>webapp:1.0</code> gebouwd. Je Docker Hub-account heet <code>kdgstudent</code>, en op deze host draait ook een eigen registry op poort 5000. Welke uitspraken zijn juist?",
 opts:["Naar Docker Hub: <code>docker login</code>, dan <code>docker tag webapp:1.0 kdgstudent/webapp:1.0</code>, dan <code>docker push kdgstudent/webapp:1.0</code>.","<code>docker push kdgstudent webapp:1.0</code> pusht de image naar het account <code>kdgstudent</code>.","Naar de eigen registry: je tagt de image als <code>localhost:5000/webapp:1.0</code> en pusht die naam.","Na <code>docker tag</code> moet je de image opnieuw bouwen voor je de nieuwe naam kan pushen.","Tagde je per ongeluk <code>kdgstudnet/webapp:1.0</code>, dan tag je opnieuw met de juiste naam en push je die."],ok:[0,2,4],
 ex:["De registry en het account staan in de naam. Een tag is een extra label, opnieuw bouwen is niet nodig."]},
{id:"R7-12",topic:"t2",type:"multi",pts:2,
 q:"Je voert <code>docker run -d --name mongo bitnami/mongodb</code> uit, en de container draait. Welke uitspraken zijn juist?",
 opts:["Docker gebruikt de tag <code>latest</code>, omdat er geen tag in de naam staat.","Voluit is de imagenaam <code>docker.io/bitnami/mongodb:latest</code>.","<code>latest</code> wijst lokaal altijd vanzelf naar de nieuwste versie op Docker Hub.","<code>docker exec -it mongo /bin/sh</code> opent een interactieve shell in de draaiende container.","<code>docker exec -it bitnami/mongodb /bin/sh</code> opent ook een shell in die container."],ok:[0,1,3],
 ex:["Zonder registry = <code>docker.io</code>, zonder tag = <code>latest</code>; die verschuift lokaal pas bij <code>docker pull</code>. <code>exec</code> krijgt een containernaam, geen imagenaam."]},
{id:"R7-13",topic:"t6",type:"multi",pts:2,
 q:"Een C-project: <code>apt-get install gcc</code> duurt 2 minuten, compileren 5 seconden, en <code>main.c</code> verandert vaak. In de projectmap staan ook <code>.git</code> en een <code>.env</code> met wachtwoorden. Welke uitspraken zijn juist?",
 opts:["Zet <code>RUN apt-get install -y gcc</code> vóór <code>COPY main.c .</code>, zodat een wijziging aan <code>main.c</code> de installatie niet opnieuw laat uitvoeren.","Wijzigt <code>main.c</code>, dan wordt enkel de COPY-regel opnieuw uitgevoerd; de regels erna komen uit de cache.","<code>RUN gcc main.c -o myapp</code> vóór <code>COPY main.c .</code> faalt, omdat <code>main.c</code> dan nog niet in de image staat.","Zet je <code>.git</code> en <code>.env</code> in <code>.dockerignore</code>, dan worden ze niet naar de builder gestuurd en niet per ongeluk in de image gekopieerd.","<code>.dockerignore</code> zorgt er ook voor dat <code>.env</code> niet in je Git-repository terechtkomt."],ok:[0,2,3],
 ex:["Wijzigt een regel (of een gekopieerd bestand), dan worden die regel en alles erna opnieuw uitgevoerd. Een Dockerfile loopt van boven naar onder."]},
{id:"R7-14",topic:"t6",type:"multi",pts:2,
 q:"Welke uitspraken over het hergebruiken en bekijken van images zijn juist?",
 opts:["Voor je zelf een image opbouwt, zoek je eerst een bestaande (bv. officiële) image die je kan hergebruiken.","Elke container heeft een eigen kopie van alle lagen van zijn image nodig.","Hoeveel lagen <code>webapp:1.0</code> heeft, zie je met <code>docker image inspect webapp:1.0</code>: je telt de sha256-waarden onder <code>RootFS</code> → <code>Layers</code>.","Het aantal lagen van een image is gelijk aan het aantal regels in zijn Dockerfile.","Een container image opleveren, en dus de Dockerfile schrijven, hoort bij het werk van de softwareontwikkelaar."],ok:[0,2,4],
 ex:["Lagen worden gedeeld; een container krijgt enkel een eigen read/write-laag. Enkel RUN, COPY en ADD maken lagen."]},
{id:"R7-15",topic:"t2",type:"multi",pts:2,
 q:"Er draaiden vooraf geen containers. Je voert drie keer na elkaar uit:<pre>$ docker run -it fedora echo hallo\nhallo</pre>Welke uitspraken zijn juist?",
 opts:["Daarna staat er geen enkele container op <code>Up</code>.","<code>docker ps -a</code> toont 3 containers met status <code>Exited</code>.","Met <code>--rm</code> erbij zouden de containers automatisch verwijderd worden zodra ze stoppen, samen met hun logs.","Met <code>--rm</code> erbij zou ook de image <code>fedora</code> verwijderd worden.","<code>docker exec -it fedora sh</code> opent een shell in een van die containers."],ok:[0,1,2],
 ex:["<code>echo hallo</code> vervangt de standaard-CMD en is meteen klaar: elke container stopt. <code>exec</code> werkt enkel in een draaiende container, met een containernaam."]},
{id:"R8-1",topic:"t2",type:"multi",pts:2,
 q:"Er draaiden vooraf geen containers.<pre>$ docker run -d --name t2 ubuntu sleep 600\n$ docker run -it --name t3 ubuntu ls /\nbin  boot  dev  etc  home  lib  ...</pre>Een halve minuut later. Welke uitspraken zijn juist?",
 opts:["<code>t3</code> staat nog op <code>Up</code>, omdat hij met <code>-it</code> gestart is.","<code>t2</code> staat op <code>Up</code>: <code>sleep 600</code> vervangt de standaard-CMD en blijft 10 minuten lopen.","<code>docker ps</code> toont zowel <code>t2</code> als <code>t3</code>.","<code>t3</code> staat op <code>Exited</code>: <code>ls /</code> is meteen klaar.","<code>docker exec -it t3 sh</code> opent een shell in <code>t3</code>."],
 ok:[1,3],
 ex:["<code>-it</code> koppelt enkel je terminal; het start geen shell. <code>ls /</code> vervangt de CMD en is meteen klaar, dus <code>t3</code> stopt.","<code>exec</code> werkt enkel in een draaiende container."]},
{id:"R8-2",topic:"t3",type:"multi",pts:2,
 q:"<pre>$ docker run -d --name db1 -v pgdata:/var/lib/postgresql/data postgres\n$ docker rm -f db1\n$ docker run -d --name db2 -v pgdata:/var/lib/postgresql/data postgres</pre>Welke uitspraken zijn juist?",
 opts:["<code>db2</code> ziet de data die <code>db1</code> schreef, omdat het volume <code>pgdata</code> heet, los van de containernaam.","<code>docker rm -f db1</code> heeft ook het volume <code>pgdata</code> verwijderd.","<code>docker volume inspect db2</code> toont waar de data van het volume op de host staat.","<code>pgdata</code> verschijnt in de uitvoer van <code>docker volume ls</code>.","Met <code>-v pgdata2:/var/lib/postgresql/data</code> bij <code>db2</code> zou <code>db2</code> dezelfde data zien, omdat het containerpad gelijk is."],
 ok:[0,3],
 ex:["Een named volume wordt op zijn naam gevonden en overleeft <code>docker rm</code>. <code>volume inspect</code> verwacht een volumenaam."]},
{id:"R8-3",topic:"t5",type:"multi",pts:2,
 q:"Twee images, allebei <code>FROM alpine:3.20</code>:<pre>kdgstudent/tool:  ENTRYPOINT [\"ls\", \"-l\"]\nkdgstudent/app:   CMD [\"ls\", \"-l\"]</pre>Welke uitspraken zijn juist?",
 opts:["<code>docker run --rm kdgstudent/tool /etc</code> voert <code>ls -l /etc</code> uit.","<code>docker run --rm kdgstudent/app /etc</code> voert <code>ls -l /etc</code> uit.","<code>docker run --rm -it kdgstudent/app sh</code> opent een shell.","<code>docker run --rm -it kdgstudent/tool sh</code> opent een shell.","<code>docker run --rm -it --entrypoint sh kdgstudent/tool</code> opent een shell."],
 ok:[0,2,4],
 ex:["ENTRYPOINT: argumenten worden erachter geplakt (<code>ls -l sh</code>). CMD: argumenten vervangen het commando (<code>/etc</code> is geen programma, <code>sh</code> wel). <code>--entrypoint</code> vervangt de ENTRYPOINT."]},
{id:"R8-4",topic:"t4",type:"fill",pts:2,
 q:"In je projectmap staat een <code>docker-compose.yml</code>. De service <code>web</code> heeft <code>build: .</code>, de service <code>db</code> gebruikt <code>image: postgres</code>. Het project draait al. Je past de Dockerfile van <code>web</code> aan. Geef het ene commando dat de image van <code>web</code> opnieuw bouwt en daarna alle services op de achtergrond start.",
 regex:/^(?=.* (-d|--detach)( |$))(?=.* --build( |$))docker[ -]compose up( (-d|--detach|--build))+$/,
 answer:"<code>docker compose up -d --build</code>",
 ex:["Zonder <code>--build</code> gebruikt Compose de bestaande lokale image. Zonder <code>-d</code> blijft <code>up</code> op de voorgrond."]},
{id:"R8-5",topic:"t6",type:"multi",pts:2,
 q:"<pre>FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build\nWORKDIR /src\nCOPY . .\nRUN dotnet publish -c Release -o /out\nFROM mcr.microsoft.com/dotnet/aspnet:8.0\nCOPY --from=build /out /app\nENTRYPOINT [\"dotnet\", \"/app/web.dll\"]</pre>Welke uitspraken over de eindimage zijn juist?",
 opts:["De eindimage bevat de SDK, omdat die in de eerste stage aanwezig was.","De eindimage is gebaseerd op <code>aspnet:8.0</code>, aangevuld met de map <code>/app</code> uit de stage <code>build</code>.","De broncode uit <code>/src</code> staat ook in de eindimage, omdat er <code>COPY . .</code> in de Dockerfile staat.","<code>--from=build</code> verwijst naar de naam die na <code>AS</code> aan de eerste stage gegeven werd.","De eindimage is kleiner dan een image die enkel uit de eerste stage zou bestaan."],
 ok:[1,3,4],
 ex:["De eindimage = de laatste stage + wat je met <code>COPY --from</code> overneemt. SDK en broncode blijven in de stage <code>build</code>."]},
{id:"R8-6",topic:"t3",type:"mc",pts:1,
 q:"De app in <code>kdgstudent/web</code> luistert in de container op poort 3000. Je wil ze op de host openen via <code>http://localhost:8080</code>. Welk commando doet dat?",
 opts:["<code>docker run -d -p 3000:8080 kdgstudent/web</code>","<code>docker run -d kdgstudent/web</code>, want de Dockerfile bevat <code>EXPOSE 3000</code>","<code>docker run -d -p 8080:3000 kdgstudent/web</code>","<code>docker run -d -p 8080:8080 kdgstudent/web</code>"],
 ok:[2],
 ex:["<code>-p HOST:CONTAINER</code>. <code>EXPOSE</code> is enkel documentatie."]},
{id:"R8-7",topic:"t1",type:"multi",pts:2,
 q:"Op de host maak je de map <code>/srv/jail</code> met een kleine Linux-bestandsstructuur. Je start <code>chroot /srv/jail /bin/sh</code> en maakt in die shell het bestand <code>/notes.txt</code>. Welke uitspraken zijn juist?",
 opts:["Op de host staat het bestand rechtstreeks in <code>/notes.txt</code>.","Op de host staat het bestand als <code>/srv/jail/notes.txt</code>.","Met cgroups bepaal je welke bestanden en mappen een proces mag zien.","Namespaces bepalen wat een proces ziet, bv. welke processen en welk netwerk.","chroot verandert enkel welke map het proces als <code>/</code> ziet; het beperkt geen CPU of geheugen."],
 ok:[1,3,4],
 ex:["Het proces denkt dat <code>/srv/jail</code> de root is: <code>/notes.txt</code> is op de host <code>/srv/jail/notes.txt</code>. cgroups = hoeveel, namespaces = wat je ziet."]},
{id:"R8-8",topic:"t6",type:"multi",pts:2,
 q:"Op Docker Hub staat <code>kdgstudent/api:2.0</code>, gebouwd met:<pre>FROM python:3.12\nCOPY . /app\nRUN pip install -r /app/requirements.txt\nCMD [\"python\", \"/app/app.py\"]</pre>Op een andere host voer je enkel <code>docker pull kdgstudent/api:2.0</code> uit. Welke uitspraken zijn juist?",
 opts:["Tijdens de pull wordt <code>pip install</code> opnieuw uitgevoerd op die host.","De lagen van de image worden gedownload; er start geen container.","Na de pull toont <code>docker ps</code> een container van <code>kdgstudent/api:2.0</code>.","De pakketten uit <code>requirements.txt</code> zitten al in een laag van de image.","<code>app.py</code> wordt meteen na de pull gestart, door de CMD."],
 ok:[1,3],
 ex:["Bij een pull wordt niets uitgevoerd: RUN liep bij <code>docker build</code>, het resultaat zit als laag in de image."]},
{id:"R8-9",topic:"t1",type:"multi",pts:2,
 q:"Een team overweegt zijn apps in containers te draaien in plaats van in VM's. Welke uitspraken zijn juist?",
 opts:["Een image bevat de app samen met de bibliotheken die ze nodig heeft, zodat ze op elke host met Docker op dezelfde manier werkt.","Elke container start een eigen kernel, net zoals een VM.","Een image die op een Ubuntu-host gebouwd is, werkt niet op een Fedora-host, omdat de bibliotheken van Ubuntu daar ontbreken.","Containers bieden een sterkere isolatie dan VM's.","Containers gebruiken minder geheugen dan VM's, omdat er per container geen volledig besturingssysteem met eigen kernel draait."],
 ok:[0,4],
 ex:["De image neemt zijn eigen bibliotheken mee; enkel de kernel wordt gedeeld."]},
{id:"R8-10",topic:"t2",type:"multi",pts:2,
 q:"Je startte <code>docker run -d --name cache redis</code>. <code>docker ps</code> toont:<pre>CONTAINER ID   IMAGE   STATUS         NAMES\na1b2c3d4e5f6   redis   Up 2 minutes   cache</pre>Welke commando's openen een interactieve shell in die draaiende container?",
 opts:["<code>docker exec -it redis sh</code>","<code>docker exec -it cache sh</code>","<code>docker run -it cache sh</code>","<code>docker exec -it a1b2c3d4e5f6 sh</code>"],
 ok:[1,3],
 ex:["<code>exec</code> krijgt de naam of de ID van een draaiende container, geen imagenaam. <code>run</code> verwacht een image."]},
{id:"R8-11",topic:"t4",type:"multi",pts:2,
 q:"<pre>services:\n  db:\n    image: postgres\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n  api:\n    image: kdgstudent/api\n    environment:\n      DB_HOST: api\nvolumes:\n  pgdata:</pre>Welke uitspraken zijn juist?",
 opts:["Het volume <code>pgdata</code> wordt ook in de container van <code>api</code> gemount, omdat het onderaan onder <code>volumes:</code> staat.","De data van <code>db</code> blijft bewaard na <code>docker compose down</code> en opnieuw <code>docker compose up -d</code>.","Zonder de regel <code>- pgdata:/var/lib/postgresql/data</code> bij <code>db</code> zou de data ook bewaard blijven, omdat <code>pgdata</code> onderaan gedeclareerd is.","<code>api</code> vindt de databank niet: <code>DB_HOST</code> moet de servicenaam <code>db</code> zijn."],
 ok:[1,3],
 ex:["Onderaan declareer je een volume enkel; een service gebruikt het pas als ze het zelf mount. Een service bereik je via zijn servicenaam."]},
{id:"R8-12",topic:"t7",type:"multi",pts:2,
 q:"Je bent op Docker Hub ingelogd als <code>kdgstudent</code>.<pre>$ docker build -t blog:2.0 .\n$ docker tag blog:2.0 kdgstudent/blog:2.0\n$ docker push kdgstudent/blog:2.0</pre>De push lukt. Welke uitspraken zijn juist?",
 opts:["<code>docker push blog:2.0</code> had ook gewerkt, omdat je ingelogd bent als <code>kdgstudent</code>.","Na <code>docker tag</code> bestaat <code>blog:2.0</code> niet meer: de image werd hernoemd.","<code>docker images</code> toont <code>blog:2.0</code> en <code>kdgstudent/blog:2.0</code> met hetzelfde IMAGE ID.","Op Docker Hub staat nu ook automatisch de tag <code>kdgstudent/blog:latest</code>.","Voluit is de gepushte naam <code>docker.io/kdgstudent/blog:2.0</code>."],
 ok:[2,4],
 ex:["<code>tag</code> voegt een naam toe. Zonder account in de naam kan je niet naar je account pushen. <code>latest</code> wordt niet vanzelf gepusht."]},
{id:"R8-13",topic:"t1",type:"multi",pts:2,
 q:"Op een Fedora-host met kernel <code>6.8</code> draait Docker. De gebruiker <code>an</code> werd toegevoegd aan de groep <code>docker</code>. Welke uitspraken zijn juist?",
 opts:["Een image op basis van Ubuntu kan niet op deze Fedora-host draaien.","<code>an</code> moet eerst <code>docker login</code> uitvoeren voor ze lokaal containers kan starten.","<code>docker run --rm alpine uname -r</code> toont <code>6.8...</code>, de kernel van de host.","Met namespaces beperk je hoeveel CPU een container mag gebruiken.","Als lid van de groep <code>docker</code> kan <code>an</code> de Docker-socket gebruiken, wat haar in de praktijk root-rechten op de host geeft."],
 ok:[2,4],
 ex:["Eén gedeelde hostkernel. <code>docker login</code> = registry. CPU beperken = cgroups."]},
{id:"R8-14",topic:"t6",type:"fill",pts:2,
 q:"Hoeveel <b>nieuwe</b> lagen voegt deze Dockerfile toe bovenop <code>alpine:3.20</code>? Antwoord met een getal.<pre>FROM alpine:3.20\nLABEL version=\"1.0\"\nRUN apk add curl\nCOPY start.sh /start.sh\nENV MODE=prod\nCOPY config/ /etc/app/\nEXPOSE 8080\nCMD [\"/start.sh\"]</pre>",
 accept:["3","drie","3 lagen","drie lagen"],
 answer:"<code>3</code>",
 ex:["Enkel RUN, COPY en ADD maken lagen. LABEL, ENV, EXPOSE en CMD zijn metadata. FROM maakt zelf geen nieuwe laag (de image erft wel de lagen van alpine)."]},
{id:"R8-15",topic:"t4",type:"multi",pts:2,
 q:"Een Compose-project met de services <code>web</code> en <code>db</code> draait op de achtergrond. <code>db</code> bewaart zijn data in het named volume <code>dbdata</code>. Je staat in de projectmap. Welke uitspraken zijn juist?",
 opts:["<code>docker compose stop</code> verwijdert de containers, maar laat het volume <code>dbdata</code> staan.","Pas je de poort van <code>web</code> aan in <code>docker-compose.yml</code>, dan maakt <code>docker compose up -d</code> de container van <code>web</code> opnieuw aan.","Na die poortwijziging volstaat ook <code>docker compose restart web</code>.","<code>docker compose down</code> verwijdert ook het volume <code>dbdata</code>.","<code>docker compose logs -f</code> volgt de output van alle services live mee."],
 ok:[1,4],
 ex:["yml aangepast → <code>up -d</code> maakt enkel de gewijzigde containers opnieuw aan. <code>restart</code> = zelfde container, oude config. Dockerfile of code aangepast → <code>up -d --build</code>."]},
{id:"R8-16",topic:"t7",type:"multi",pts:2,
 q:"<pre>$ docker images\nREPOSITORY       TAG      IMAGE ID       SIZE\nkdgstudent/app   2.0      f00ba4123456   180MB\nkdgstudent/app   latest   f00ba4123456   180MB</pre>Op Docker Hub staat intussen een nieuwere <code>kdgstudent/app:latest</code>. Lokaal deed je nog niets. Welke uitspraken zijn juist?",
 opts:["<code>docker run -d kdgstudent/app</code> haalt automatisch de nieuwere versie van Docker Hub.","<code>docker rmi kdgstudent/app:latest</code> haalt enkel het label <code>latest</code> weg; de image blijft bestaan via <code>2.0</code>.","De twee regels nemen samen ongeveer 360 MB schijfruimte in.","<code>docker run -d kdgstudent/app</code> en <code>docker run -d kdgstudent/app:latest</code> starten dezelfde image.","Na <code>docker pull kdgstudent/app</code> wijst <code>2.0</code> naar de nieuwe versie."],
 ok:[1,3],
 ex:["Een tag is een label. <code>run</code> downloadt niet als de image lokaal bestaat; <code>latest</code> verschuift pas bij <code>pull</code>."]},
{id:"R8-17",topic:"t2",type:"multi",pts:2,

MINE.forEach(q=>{ q.src = "Oefenronde "+q.id[1]; });
const ALL = Q.concat(MINE);
const POOL = ALL.filter(q=>q.topic);
const TOPICS = [
 {id:"t1",name:"Containers op Linux"},
 {id:"t2",name:"Docker CLI: images en containers"},
 {id:"t3",name:"Poorten en volumes"},
 {id:"t4",name:"Docker Compose"},
 {id:"t5",name:"Dockerfile"},
 {id:"t6",name:"Lagen, cache, multi-stage en security"},
 {id:"t7",name:"Publiceren en registries"}
];

const VERSION = "v0.1";

const TYPE = {mc:"Meerkeuze",multi:"Meerdere antwoorden",fill:"Invulvraag",open:"Open vraag"};
const L = "ABCDEFGH";
const KEY = "cs2-docker-quiz-v2";
const BYID = Object.fromEntries(ALL.map(q=>[q.id,q]));
const TNAME = Object.fromEntries(TOPICS.map(t=>[t.id,t.name]));
const MIN=10, MAX=Math.min(40,POOL.length);
let state = {phase:"start", n:20, sel:[], cur:0, ans:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s && Array.isArray(s.sel) && s.sel.every(id=>BYID[id])) state=s; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const $ = s => document.querySelector(s);
const norm = s => s.trim().replace(/^[`'"“”‘’]+|[`'"“”‘’]+$/g,"").trim().replace(/\s+/g," ").toLowerCase();
const fmt = x => (Math.round(x*10)/10).toString().replace(".",",");
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function pick(n){
  const groups = TOPICS.map(t=>({t:t.id, qs:shuffle(POOL.filter(q=>q.topic===t.id))}));
  const alloc = groups.map(()=>1);
  let rest = n - groups.length;
  const extra = groups.reduce((s,g)=>s+g.qs.length-1,0);
  const want = groups.map(g=>rest*(g.qs.length-1)/extra);
  groups.forEach((g,i)=>{ alloc[i]+=Math.floor(want[i]); });
  let left = n - alloc.reduce((a,b)=>a+b,0);
  const order = groups.map((g,i)=>i).sort((a,b)=>(want[b]%1)-(want[a]%1) || Math.random()-.5);
  for(const i of order){ if(left<=0) break; if(alloc[i]<groups[i].qs.length){alloc[i]++; left--;} }
  while(left>0){ const i=groups.findIndex((g,k)=>alloc[k]<g.qs.length); alloc[i]++; left--; }
  return groups.flatMap((g,i)=>g.qs.slice(0,alloc[i]).map(q=>q.id));
}

function grade(q,a){
  if(q.type==="mc") return a.sel.length===1 && q.ok.includes(a.sel[0]) ? q.pts : 0;
  if(q.type==="multi"){ const hit=a.sel.filter(i=>q.ok.includes(i)).length, miss=a.sel.length-hit; return Math.max(0, Math.round(q.pts*(hit-miss)/q.ok.length*10)/10); }
  if(q.type==="fill"){ const v=norm(a.text), w=v.replace(/[.;,]+$/,""); const ok=x=>q.regex ? q.regex.test(x) : q.accept.map(norm).includes(x); return (ok(v)||ok(w)) ? q.pts : 0; }
  return a.self==null ? null : a.self;
}
function stat(id){ const a=state.ans[id], q=BYID[id]; if(!a||!a.done||a.pts==null) return ""; return a.pts>=q.pts?"ok":a.pts<=0?"bad":"half"; }

function renderHeader(){
  const inQuiz = state.phase==="quiz";
  let got=0,max=0,done=0;
  if(inQuiz) state.sel.forEach(id=>{ const a=state.ans[id]; if(a&&a.done&&a.pts!=null){got+=a.pts; max+=BYID[id].pts; done++;} });
  $("#score").innerHTML = inQuiz ? (done?`Score: <b>${fmt(got)} / ${max}</b> · ${done}/${state.sel.length} beantwoord`:`${state.sel.length} vragen`) : "";
  $("#toolbar").style.display = inQuiz ? "" : "none";
  const g=$("#grid"); g.innerHTML=""; g.style.display = inQuiz ? "" : "none";
  if(!inQuiz) return;
  state.sel.forEach((id,k)=>{
    const b=document.createElement("button");
    b.className="dot "+stat(id)+(state.cur===k?" cur":"");
    b.textContent=k+1; b.title="Vraag "+(k+1)+" · "+TNAME[BYID[id].topic];
    b.onclick=()=>{state.cur=k; save(); render();};
    g.appendChild(b);
  });
  const e=document.createElement("button"); e.className="dot"+(state.cur==="end"?" cur":""); e.textContent="✓"; e.title="Resultaat";
  e.onclick=()=>{state.cur="end"; save(); render();}; g.appendChild(e);
}

function render(){
  renderHeader();
  if(state.phase==="start") return renderStart();
  if(state.cur==="end") return renderEnd();
  renderQ();
}

function renderStart(){
  const counts = Object.fromEntries(TOPICS.map(t=>[t.id,POOL.filter(q=>q.topic===t.id).length]));
  const hasOld = state.sel.length>0;
  let h = `<div class="card"><h2 style="margin:0 0 6px;font-size:20px">Nieuw oefenexamen</h2>
  <p style="margin:0 0 16px;color:var(--muted)">Kies hoeveel vragen je wil. Je krijgt een willekeurige selectie uit minstens ${POOL.length} vragen. Er worden doorlopend vragen bijgevoegd tot en met de examendatum. Vragen zijn verdeeld over alle onderdelen van de cursus: elk onderdeel komt minstens één keer aan bod.</p>
  <label for="nRange" style="font-weight:600">Aantal vragen: <span id="nVal">${state.n}</span></label>
  <input type="range" id="nRange" min="${MIN}" max="${MAX}" step="1" value="${state.n}" style="width:100%;margin:10px 0 8px">
  <div class="actions" style="margin-top:4px">${[10,15,20,30,MAX].map(v=>`<button class="btn" data-n="${v}">${v}</button>`).join("")}</div>
  <h3 style="font-size:15px;margin:20px 0 6px">Onderdelen</h3>
  <ul class="endlist" style="font-size:14px">${TOPICS.map(t=>`<li style="cursor:default"><span>${t.name}</span><span style="color:var(--muted)">${counts[t.id]} vragen</span></li>`).join("")}</ul>
  <div class="actions" style="margin-top:18px"><button class="btn primary" id="go">Start examen</button>${hasOld?`<button class="btn" id="resume">Verder met vorig examen (${state.sel.length} vragen)</button>`:""}</div>
  <p class="hint" style="margin-top:10px"><b>Puntentelling</b><br>• Meerkeuze (één antwoord): 1 punt. Juist = 1, fout = 0.<br>• Invulvraag: 2 punten. Juist = 2, fout = 0.<br>• Meerdere antwoorden: 2 punten. Elke juiste optie die je aanduidt is 2 ÷ (aantal juiste opties) waard; elke foute optie die je aanduidt trekt evenveel af. Niet gokken dus. Een vraag geeft nooit minder dan 0.<br>Voorbeeld: 2 juiste opties, je duidt er één juiste en één foute aan → 1 − 1 = 0 punten.<br>Alles wordt automatisch verbeterd. Bij invulvragen maken hoofdletters, spaties, aanhalingstekens en een punt op het einde niets uit.</p><p class="hint" style="margin-top:10px"><b>Privacy</b><br>Je voortgang blijft enkel in je eigen browser; er wordt niets doorgestuurd. Herlaad de pagina voor de nieuwste vragen.</p></div>`;
  $("#main").innerHTML=h;
  const r=$("#nRange"), v=$("#nVal");
  r.oninput=()=>{ state.n=+r.value; v.textContent=r.value; save(); };
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ state.n=+b.dataset.n; r.value=state.n; v.textContent=state.n; save(); });
  $("#go").onclick=()=>{ state.sel=pick(state.n); state.ans={}; state.cur=0; state.phase="quiz"; save(); render(); window.scrollTo(0,0); };
  const rs=$("#resume"); if(rs) rs.onclick=()=>{ state.phase="quiz"; if(state.cur!=="end" && state.cur>=state.sel.length) state.cur=0; save(); render(); };
}

function renderQ(){
  const k=state.cur, id=state.sel[k], q=BYID[id];
  const a = state.ans[id] || (state.ans[id]={sel:[],text:"",self:null,done:false,pts:null});
  const N=state.sel.length;
  let h=`<div class="card ${a.done?"locked":""}"><div class="meta"><span class="tag">Vraag ${k+1} / ${N}</span><span>${TYPE[q.type]} · ${q.pts} punt${q.pts>1?"en":""}</span><span class="tag oos" style="background:var(--bg);color:var(--muted)">${TNAME[q.topic]}</span></div>`;
  h+=`<div class="q">${q.q}${q.type==="multi"?' <span class="hint">(meerdere antwoorden mogelijk)</span>':""}</div>`;
  if(q.type==="mc"||q.type==="multi"){
    const it=q.type==="mc"?"radio":"checkbox";
    q.opts.forEach((o,j)=>{
      let cls=""; if(a.done){const c=a.sel.includes(j), r=q.ok.includes(j); cls=r&&c?"correct":c?"wrong":r?"missed":"";}
      h+=`<label class="opt ${cls}"><input type="${it}" name="o" value="${j}" ${a.sel.includes(j)?"checked":""} ${a.done?"disabled":""}><span class="l">${L[j]}.</span><span class="t">${o}</span></label>`;
    });
  } else if(q.type==="fill"){
    h+=`<input type="text" id="fillIn" autocomplete="off" spellcheck="false" placeholder="Jouw antwoord" value="${escA(a.text)}" ${a.done?"disabled":""}>`;
  } else {
    h+=`<textarea id="openIn" placeholder="Schrijf je antwoord (2 à 3 zinnen)" ${a.done?"disabled":""}>${escH(a.text)}</textarea><p class="hint">Na bevestigen zie je het modelantwoord en beoordeel je jezelf.</p>`;
  }
  h+=`<div class="err" id="err"></div>`;
  h+= a.done ? resultHtml(q,a) : `<div class="actions"><button class="btn primary" id="confirm">Bevestig</button></div>`;
  h+=`<p class="hint" style="margin-top:12px">Bron: ${q.src}</p></div>`;
  h+=`<nav class="pager"><button class="btn" id="prev" ${k===0?"disabled":""}>← Vorige</button><button class="btn" id="next">${k===N-1?"Naar resultaat →":"Volgende →"}</button></nav>`;
  const m=$("#main"); m.innerHTML=h;
  m.querySelectorAll("input[name=o]").forEach(x=>x.addEventListener("change",()=>{ a.sel=[...m.querySelectorAll("input[name=o]:checked")].map(y=>+y.value); $("#err").textContent=""; save(); }));
  const f=$("#fillIn"); if(f){ f.addEventListener("input",()=>{a.text=f.value; $("#err").textContent=""; save();}); f.addEventListener("keydown",e=>{ if(e.key==="Enter") confirmQ(); }); }
  const t=$("#openIn"); if(t) t.addEventListener("input",()=>{a.text=t.value; $("#err").textContent=""; save();});
  const c=$("#confirm"); if(c) c.onclick=confirmQ;
  m.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{ a.self=+b.dataset.self; a.pts=a.self; save(); render(); });
  $("#prev").onclick=()=>{ state.cur=k-1; save(); render(); window.scrollTo(0,0); };
  $("#next").onclick=()=>{ state.cur= k===N-1 ? "end" : k+1; save(); render(); window.scrollTo(0,0); };
  function confirmQ(){
    if((q.type==="mc"||q.type==="multi") && !a.sel.length){ $("#err").textContent="Duid eerst een antwoord aan."; return; }
    if((q.type==="fill"||q.type==="open") && !a.text.trim()){ $("#err").textContent="Vul eerst een antwoord in."; return; }
    a.done=true; a.pts=grade(q,a); save(); render();
  }
}

function resultHtml(q,a){
  if(q.type==="open"){
    let h=`<div class="result ${a.self==null?"":a.self>=q.pts?"ok":a.self<=0?"bad":"half"}"><h3>Modelantwoord</h3><ul>${q.model.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    h+= a.self==null ? `<div class="self"><span class="hint" style="margin:6px 4px 0 0">Hoe goed was jouw antwoord?</span><button class="btn" data-self="${q.pts}">Juist (${q.pts})</button><button class="btn" data-self="${q.pts/2}">Half (${fmt(q.pts/2)})</button><button class="btn" data-self="0">Fout (0)</button></div>` : `<p class="hint">Jouw beoordeling: ${fmt(a.self)} / ${q.pts}</p>`;
    return h+`</div>`;
  }
  const p=a.pts, cls=p>=q.pts?"ok":p<=0?"bad":"half", title=p>=q.pts?"Juist!":p<=0?"Fout":"Gedeeltelijk juist";
  let h=`<div class="result ${cls}"><h3>${title} · ${fmt(p)} / ${q.pts}</h3>`;
  h+= (q.type==="mc"||q.type==="multi") ? `<p class="model">Juist antwoord: <b>${q.ok.map(j=>L[j]).join(", ")}</b></p>` : `<p class="model">Juist antwoord: ${q.answer}</p>`;
  if(q.ex) h+=`<ul>${q.ex.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  return h+`</div>`;
}

function renderEnd(){
  let got=0,max=0,open=0; const per={};
  TOPICS.forEach(t=>per[t.id]={g:0,m:0});
  state.sel.forEach(id=>{ const q=BYID[id], a=state.ans[id]; max+=q.pts; per[q.topic].m+=q.pts; if(a&&a.done&&a.pts!=null){got+=a.pts; per[q.topic].g+=a.pts;} else open++; });
  const pct=max?Math.round(got/max*100):0;
  let h=`<div class="card end"><h2>Resultaat</h2><div class="big">${fmt(got)} / ${max}</div><div class="bar"><span style="width:${pct}%"></span></div><p>${pct}%${open?` · nog ${open} vra${open>1?"gen":"ag"} open`:""}</p>`;
  h+=`<h3 style="font-size:15px;margin:18px 0 6px">Per onderdeel</h3><ul class="endlist" style="font-size:14px">${TOPICS.filter(t=>per[t.id].m).map(t=>{const p=per[t.id]; const r=p.g/p.m; return `<li style="cursor:default"><span>${t.name}</span><span style="color:${r>=.75?"var(--ok)":r>=.5?"var(--warn)":"var(--bad)"}">${fmt(p.g)} / ${p.m}</span></li>`;}).join("")}</ul>`;
  h+=`<h3 style="font-size:15px;margin:18px 0 6px">Per vraag</h3><ul class="endlist">`;
  state.sel.forEach((id,k)=>{ const a=state.ans[id], q=BYID[id]; const s=a&&a.done&&a.pts!=null?`${fmt(a.pts)} / ${q.pts}`:"—";
    h+=`<li data-k="${k}"><span>Vraag ${k+1} · ${TNAME[q.topic]}</span><span>${s}</span></li>`; });
  const d=new Date(), ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const lines=["Resultaat oefenpagina CS2 Docker "+VERSION+" – "+ds,"Score: "+fmt(got)+" / "+max+" ("+pct+"%)",""];
  state.sel.forEach(id=>{ const a=state.ans[id], q=BYID[id]; const s=a&&a.done&&a.pts!=null ? (a.pts>=q.pts?"✅":a.pts<=0?"❌":"🟡")+" "+fmt(a.pts)+"/"+q.pts : "– niet beantwoord";
    let pick=""; if(a&&a.done){ if(q.opts) pick=" (gekozen: "+(a.sel.map(j=>L[j]).join(",")||"-")+")"; else if(q.type==="fill") pick=" (antwoord: "+a.text.trim()+")"; }
    lines.push(id+" · "+q.topic+" · "+s+pick); });
  const report=lines.join("\n");
  h+=`</ul><h3 style="font-size:15px;margin:18px 0 6px">Resultaat bewaren</h3><p class="hint" style="margin:0 0 8px">Kopieer je resultaat als je het wil bijhouden, bv. in je notities of om er later met AI of een medestudent je fouten mee te bespreken.</p><textarea id="report" readonly style="min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px">${escH(report)}</textarea>
  <div class="actions" style="margin-top:10px"><button class="btn" id="copy">Kopieer resultaat</button><button class="btn primary" id="again">Nieuw examen</button><span class="hint" id="copied" style="align-self:center"></span></div></div>`;
  $("#main").innerHTML=h;
  $("#copy").onclick=async()=>{ const ta=$("#report"); try{ await navigator.clipboard.writeText(report); $("#copied").textContent="Gekopieerd."; }catch(e){ ta.focus(); ta.select(); $("#copied").textContent="Selecteer en kopieer de tekst hierboven (Ctrl/Cmd+C)."; } };
  $("#main").querySelectorAll("[data-k]").forEach(li=>li.onclick=()=>{state.cur=+li.dataset.k; save(); render(); window.scrollTo(0,0);});
  $("#again").onclick=()=>{ state.phase="start"; save(); render(); window.scrollTo(0,0); };
}
function escH(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escA(s){return escH(s).replace(/"/g,"&quot;");}

let armed=false;
$("#newBtn").onclick=e=>{
  if(!armed){ armed=true; e.target.textContent="Zeker? Klik nog eens"; setTimeout(()=>{armed=false; e.target.textContent="Nieuw examen";},3000); return; }
  armed=false; e.target.textContent="Nieuw examen"; state.phase="start"; save(); render(); window.scrollTo(0,0);
};
render();
</script>
</body>
</html>
