<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Docker – interactief oefenexamen</title>
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1c1c1a;--muted:#6b6a65;--line:#e3e1db;
  --accent:#2f5d8a;--accent-soft:#e7eef6;--ok:#2e7d4f;--ok-soft:#e5f4e9;--bad:#b23a3a;--bad-soft:#fbeaea;
  --warn:#8a6a12;--warn-soft:#f8f0d9;--code:#f1efe9;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe6;--muted:#a3a19a;--line:#33322e;
  --accent:#7fb0e0;--accent-soft:#1d2a38;--ok:#6fcf97;--ok-soft:#18301f;--bad:#f08b8b;--bad-soft:#3a1d1d;
  --warn:#e3c46b;--warn-soft:#332b14;--code:#2a2a27;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:20px;font-weight:600;margin:0}
.score{font-size:14px;color:var(--muted)}
.score b{color:var(--ink);font-size:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}
.toolbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.half{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.dot.oos{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.tag{padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.tag.oos{background:var(--warn-soft);color:var(--warn)}
.q{font-size:17px;margin:0 0 14px}
pre{background:var(--code);border-radius:8px;padding:10px 12px;overflow-x:auto;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:10px 0 14px;white-space:pre}
code{font:0.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px}
pre code{background:none;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background .1s}
.opt:hover{background:var(--bg)}
.opt input{margin-top:5px;flex:none}
.opt .l{font-weight:600;flex:none}
.opt .t{flex:1;min-width:0}
.opt .t pre{margin:6px 0 0}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.locked .opt{cursor:default}
.locked .opt:hover{background:inherit}
.locked .opt.correct:hover{background:var(--ok-soft)}
.locked .opt.wrong:hover{background:var(--bad-soft)}
input[type=text],textarea{width:100%;font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{font-family:inherit;min-height:110px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{font-size:13px;color:var(--bad);min-height:18px;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button.btn{font:inherit;font-size:15px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.btn:hover{background:var(--bg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
@media (prefers-color-scheme: dark){button.primary{color:#10202f}}
.result{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:4px solid var(--accent);background:var(--accent-soft)}
.result.ok{border-color:var(--ok);background:var(--ok-soft)}
.result.bad{border-color:var(--bad);background:var(--bad-soft)}
.result.half{border-color:var(--warn);background:var(--warn-soft)}
.result h3{margin:0 0 6px;font-size:15px}
.result ul{margin:6px 0 0;padding-left:20px}
.result li{margin:3px 0}
.model{margin:4px 0 8px}
.self{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
nav.pager{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.end h2{font-size:22px;margin:0 0 8px}
.big{font-size:40px;font-weight:700;margin:6px 0}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 18px}
.bar span{display:block;height:100%;background:var(--accent)}
.endlist{list-style:none;padding:0;margin:0}
.endlist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.endlist li:hover{color:var(--accent)}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CS2 Docker – oefenexamen <span style="font-size:13px;font-weight:400;color:var(--muted)">v0.1</span></h1>
    <div class="score" id="score"></div>
  </header>
  <div class="toolbar" id="toolbar">
    <button class="btn" id="newBtn" style="font-size:13px;padding:4px 10px">Nieuw examen</button>
  </div>
  <div class="grid" id="grid" aria-label="Vragen"></div>
  <main id="main"></main>
</div>
<script>const Q = [
{n:1,type:"mc",pts:1,
 q:"Een bedrijf zet zijn monolithische applicatie om naar microservices in Docker-containers. De security officer maakt zich zorgen. Welk scenario illustreert het best een nadeel waar hij zich terecht zorgen over maakt?",
 opts:["Een ontwikkelaar verwijdert per ongeluk een container, waardoor alle klantgegevens in het bestandssysteem van die container verloren gaan.",
 "Een kwetsbaarheid in de kernel wordt vanuit één container misbruikt, waardoor een aanvaller toegang krijgt tot de host en tot andere containers die dezelfde kernel delen.",
 "De applicatie is trager dan op een VM, omdat Docker een zware emulatielaag voor de hardware toevoegt.",
 "De applicatie start niet op de productieserver, omdat de image niet de systeembibliotheken bevat die wel op de laptop van de ontwikkelaar stonden."],
 ok:[1],
 ex:["Begrijp het risico van de gedeelde kernel: er is maar één kernel, dus een lek erin raakt de host én alle containers. Bij VM's heeft elke VM een eigen kernel en isoleert dus sterker.",
 "A los je op met volumes. C klopt niet, want er is geen emulatie. D is net wat containers oplossen."]},
{n:2,type:"multi",pts:2,q:"Welke uitspraken zijn juist?",
 opts:["Namespaces zorgen ervoor dat een container enkel zijn eigen processen ziet.","Met cgroups beperk je hoeveel CPU en geheugen een container mag gebruiken.","Docker gebruikt een hypervisor om elke container een eigen kernel te geven.","<code>chroot</code> alleen volstaat om een proces volledig te isoleren.","Alle containers op dezelfde host delen de kernel van de host."],
 ok:[0,1,4],
 ex:["Docker gebruikt geen hypervisor.","<code>chroot</code> isoleert enkel bestanden: het proces ziet bv. <code>/myAppFolder</code> als <code>/</code>. Processen, netwerk en gebruikers blijven gedeeld."]},
{n:3,type:"multi",pts:2,q:"Welke uitspraken zijn juiste verschillen tussen een virtuele machine (VM) en een container?",
 opts:["Een VM heeft een eigen kernel bovenop een hypervisor; een container deelt de kernel van de host.","Een container start veel sneller op dan een VM.","Een container emuleert hardware, een VM niet.","Een VM deelt de kernel van de host, een container heeft een eigen kernel.","Een container is een geïsoleerd proces op de host (namespaces en cgroups)."],ok:[0,1,4],
 ex:["Een container deelt de kernel van de host en is een geïsoleerd proces; daardoor is hij veel lichter en start hij in seconden.","Een VM draait een eigen besturingssysteem met eigen kernel bovenop een hypervisor die hardware emuleert."]},
{n:4,type:"multi",pts:2,q:"Welke uitspraken over containers in de praktijk zijn juist?",
 opts:["Op één host kunnen tientallen tot honderden containers tegelijk draaien.","Docker is niet de enige manier om containers te draaien: images zijn gestandaardiseerd (OCI) en werken ook met bv. Podman of containerd.","Microservices draaien vaak in containers die over meerdere machines verspreid zijn, en clouddiensten gebruiken containers op grote schaal.","Per host kan je van eenzelfde image maar één container starten.","Containers zijn enkel bedoeld voor ontwikkeling en testen, niet voor productie."],
 ok:[0,1,2],
 ex:["Een microservice is bv. een webserver of een databank, elk in een eigen container.","Van één image start je zoveel containers als je wil, ook in productie."]},
{n:5,type:"multi",pts:2,q:"Welke uitspraken over het hergebruiken van images zijn juist?",
 opts:["Voor je zelf een image opbouwt, zoek je eerst een bestaande (bv. officiële) image die je kan hergebruiken.","Als alle images binnen een project van dezelfde base image vertrekken, staan die gedeelde lagen maar één keer op een host.","Een container image opleveren (en dus de Dockerfile schrijven) hoort bij het werk van de softwareontwikkelaar.","Elke container heeft een eigen kopie van alle lagen van zijn image nodig."],
 ok:[0,1,2],
 ex:["Lagen worden gedeeld. Een container krijgt enkel een eigen read/write-laag bovenaan."]},
{n:6,type:"fill",pts:2,
 q:"<code>docker ps</code> geeft deze uitvoer:<pre>CONTAINER ID   IMAGE   COMMAND                  CREATED\nfa538e1a29bd   nginx   \"/docker-entrypoint.…\"   6 seconds ago</pre>Vul het ontbrekende woord aan om een interactieve shell in deze draaiende container te starten:<pre>docker ____ -it fa538e1a29bd /bin/sh</pre>",
 accept:["exec","docker exec","docker exec -it"],answer:"<code>exec</code>",
 ex:["<code>exec</code> voert iets uit in een draaiende container. Met <code>exit</code> stopt enkel die shell, niet de container.","<code>docker attach</code> liever niet: met <code>exit</code> sluit je dan de container."]},
{n:7,type:"mc",pts:1,
 q:"Je voert deze commando's na elkaar uit. Er draaiden vooraf geen containers.<pre>$ docker container run -it fedora echo \"hello 1\"\nhello 1\n$ docker container run -it fedora echo \"hello 2\"\nhello 2\n$ docker container run -it fedora echo \"hello 3\"\nhello 3</pre>Hoeveel containers zijn er daarna nog actief (status Up)?",
 opts:["3","1, want die ene container heeft de drie verzoeken afgehandeld.","0","2"],ok:[2],
 ex:["Elke <code>docker run</code> maakt een nieuwe container, en die stopt zodra <code>echo</code> klaar is. <code>docker ps -a</code> toont 3 containers met <code>Exited</code>.","De image blijft staan. Een image is \"dom\": die voert zelf niets uit."]},
{n:8,type:"mc",pts:1,q:"Waarom is het aanbevolen om <code>docker run --rm ...</code> te gebruiken?",
 opts:["De container wordt automatisch verwijderd zodra hij stopt, zodat je geen hoop gestopte containers overhoudt.","De image wordt automatisch verwijderd zodra de container stopt.","De container draait dan niet als root.","Alle volumes worden alleen-lezen gemount."],ok:[0],
 ex:["Let op: met de container verdwijnen ook zijn logs. Crasht hij meteen, dan kan je niet meer nakijken waarom."]},
{n:9,type:"multi",pts:2,
 q:"<code>docker ps</code> toont:<pre>CONTAINER ID   IMAGE        COMMAND                  STATUS         NAMES\n4f1c2b9a7e30   nginx:1.27   \"/docker-entrypoint.…\"   Up 5 minutes   web</pre>Welke commando's zijn correct?",
 opts:["<code>docker stop web</code>","<code>docker exec -it 4f1c sh</code>","<code>docker run -d nginx:1.27</code> (start een tweede container)","<code>docker run -d web</code>","<code>docker exec -it nginx:1.27 sh</code>"],ok:[0,1,2],
 ex:["<b>Image</b> (naam:tag of image ID, voert zelf niets uit): <code>run</code>, <code>pull</code>, <code>push</code>, <code>tag</code>, <code>rmi</code>.","<b>Container</b> (naam of container ID): <code>start</code>, <code>stop</code>, <code>exec</code>, <code>logs</code>, <code>rm</code>.","D en E halen die twee door elkaar: <code>web</code> is een container, <code>nginx:1.27</code> een image."]},
{n:10,type:"fill",pts:2,q:"Je voert <code>docker run bitnami/mongodb</code> uit. Welke tag van de image wordt gebruikt?",
 accept:["latest",":latest","bitnami/mongodb:latest","docker.io/bitnami/mongodb:latest","de tag latest","tag latest"],answer:"<code>latest</code>",
 ex:["Volledige naam: <code>[registry/][account/]naam[:tag]</code>. Zonder registry is het <code>docker.io</code>, zonder tag <code>latest</code>.","Een tag is een label, geen kopie. <code>latest</code> is niet automatisch de nieuwste: lokaal verandert hij pas bij <code>docker pull</code>."]},
{n:11,type:"mc",pts:1,
 q:"Je voert deze commando's uit:<pre>$ docker run hello-world\n$ docker ps -a\nCONTAINER ID   IMAGE         COMMAND    CREATED         STATUS\nb3cc9b72393f   hello-world   \"/hello\"   8 seconds ago   Exited (0) 7 seconds ago\n$ docker rm b3c</pre>Werkt het laatste commando?",
 opts:["Ja: de container is gestopt, en een afgekort ID volstaat zolang het uniek is.","Nee: je moet het volledige container-ID opgeven.","Nee: een gestopte container moet je eerst opnieuw starten voor je hem kan verwijderen.","Nee: <code>docker rm</code> verwijdert images; voor een container heb je <code>docker rmi</code> nodig."],ok:[0],
 ex:["De container is gestopt (<code>Exited</code>), dus je mag hem verwijderen. Je mag een ID afkorten tot de eerste tekens, zolang die uniek zijn.","Omgekeerd voor D: <code>docker rm</code> = container, <code>docker rmi</code> = image."]},
{n:12,type:"fill",pts:2,
 q:"In je <code>docker-compose.yml</code> staat:<pre>services:\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: ${DB_PASSWORD}</pre>In welk bestand, in dezelfde map, zet je <code>DB_PASSWORD=geheim</code>, zodat <code>docker compose up</code> de waarde automatisch invult? Geef de bestandsnaam.",
 accept:[".env","env",".env-bestand","env-bestand",".env bestand","env bestand",".env file","env file","bestand .env","het bestand .env","het .env-bestand","het .env bestand"],answer:"<code>.env</code>",
 ex:["Altijd opletten met <code>.env</code>: zet het in <code>.gitignore</code> én <code>.dockerignore</code>. Een wachtwoord dat ooit in een laag van een image zat, raak je niet meer kwijt."]},
{n:13,type:"mc",pts:1,
 q:"Deze twee commando's werken allebei:<pre>docker run -d httpd\ndocker run -d httpd</pre>Maar bij deze twee commando's faalt het tweede:<pre>docker run -d -p 80:80 httpd\ndocker run -d -p 80:80 httpd</pre>Waarom?",
 opts:["Je kan van dezelfde image maar één container met gepubliceerde poorten starten.","Poort 80 op de host is al in gebruik door de eerste container. Een hostpoort kan maar één keer gepubliceerd worden.","Poort 80 in de tweede container is al bezet door de eerste container.","Voor poorten onder 1024 moet je <code>--privileged</code> meegeven."],ok:[1],
 ex:["<code>-p HOST:CONTAINER</code>. Elke container heeft een eigen netwerk, dus allemaal op poort 80 luisteren mag. Oplossing: <code>-p 8080:80</code>."]},
{n:14,type:"mc",pts:1,
 q:"Op de host bestaat de map <code>/data/shared</code>. Je start twee containers:<pre>docker run -d --name container-A -v /data/shared:/app/output ubuntu-app-1\ndocker run -d --name container-B -v /data/shared:/var/log/app ubuntu-app-2</pre>De applicatie in container-A schrijft het bestand <code>rapport.pdf</code> in <code>/app/output/</code>. Wat gebeurt er?",
 opts:["<code>rapport.pdf</code> is enkel zichtbaar in container-A, want containers kunnen elkaars bestanden nooit zien.","<code>rapport.pdf</code> verschijnt meteen op de host in <code>/data/shared</code>, maar container-B ziet het pas na een herstart.","<code>rapport.pdf</code> is meteen zichtbaar op de host in <code>/data/shared</code> én in container-B als <code>/var/log/app/rapport.pdf</code>.","Container-A loopt vast, want een bind mount hoort exclusief bij de laatst gestarte container.","Het bestand wordt niet gedeeld, want de paden in beide containers zijn verschillend."],ok:[2],
 ex:["Bind mount: <code>-v mijnmap:containermap</code>. De bestanden staan op de host, de container denkt dat hij in zijn eigen map schrijft. Het is live, en het overleeft <code>docker rm</code>.","Containers met dezelfde hostmap delen die, ook met verschillende paden in de container.","Named volume (<code>-v pgdata:/...</code>): enkel een naam, Docker beheert de opslag."]},
{n:15,type:"multi",pts:2,q:"Welke uitspraken over argumenten na de imagenaam bij <code>docker run</code> en over CMD/ENTRYPOINT zijn juist?",
 opts:["Heeft de image enkel een CMD, dan vervangen de argumenten na de imagenaam de CMD.","Heeft de image enkel een CMD, dan worden de argumenten achter de CMD geplakt.","Heeft de image enkel een ENTRYPOINT, dan worden de argumenten achter de ENTRYPOINT geplakt.","ENTRYPOINT kies je als de image altijd hetzelfde programma moet starten, bv. een command-line-tool.","Een ENTRYPOINT kan je bij <code>docker run</code> nooit overschrijven."],ok:[0,2,3],
 ex:["CMD = standaardcommando dat je kan vervangen: <code>docker run img ls</code> voert <code>ls</code> uit.","ENTRYPOINT: argumenten worden erachter geplakt; overschrijven kan wel, met <code>--entrypoint</code>."]},
{n:16,type:"multi",pts:2,q:"Welke uitspraken over de RUN-instructie in een Dockerfile zijn juist?",
 opts:["Een volgende RUN-instructie overschrijft de vorige.","RUN mag maar één keer in een Dockerfile staan.","RUN mag meerdere keren in een Dockerfile staan.","RUN wordt uitgevoerd wanneer de container start.","RUN wordt uitgevoerd tijdens het bouwen van de image."],ok:[2,4],
 ex:["RUN dient om de image te maken: bij <code>docker build</code>, vóór het starten. Elke RUN maakt een laag."]},
{n:17,type:"mc",pts:1,note:"Te geavanceerd volgens de leerkracht",
 q:"Gegeven deze Dockerfile:<pre>FROM busybox\nCMD [\"echo\", \"$HOME\"]</pre>Wat is de output van <code>docker run &lt;image&gt;</code>?",
 opts:["<code>/root</code>","<code>$HOME</code>","Een lege regel","Een foutmelding"],ok:[1],
 ex:["De exec-vorm (JSON) heeft geen shell, dus je ziet letterlijk <code>$HOME</code>. De shell-vorm <code>CMD echo $HOME</code> geeft <code>/root</code>."]},
{n:18,type:"mc",pts:1,oos:true,
 q:"Deze image bevat enkel een statisch gecompileerd programma. Er staat geen CMD of ENTRYPOINT in:<pre>FROM scratch\nCOPY hello /hello</pre>Is deze image bruikbaar?",
 opts:["Nee, <code>docker build</code> faalt zonder CMD.","Ja, maar je moet het programma zelf opgeven: <code>docker run img /hello</code>. Zonder commando faalt <code>docker run</code> met \"no command specified\".","Ja, Docker start automatisch een shell.","Nee, een image op basis van <code>scratch</code> kan nooit gestart worden."],ok:[1],
 ex:["<code>scratch</code> is een lege containerdoos. Zonder CMD moet je het commando bij het opstarten meegeven."]},
{n:19,type:"fill",pts:2,
 q:"Deze multi-stage Dockerfile is nog niet af:<pre># Stage 1: bouwen\nFROM mcr.microsoft.com/dotnet/sdk:10.0 AS build-env\nWORKDIR /src\nCOPY *.csproj ./\nRUN dotnet restore\nCOPY . ./\nRUN dotnet publish -c Release -o /out\n\n# Stage 2: productie\nFROM mcr.microsoft.com/dotnet/aspnet:10.0\nWORKDIR /app\n[AANVULLEN]\nENTRYPOINT [\"dotnet\", \"MyDotNetApp.dll\"]</pre>Schrijf de volledige regel voor <code>[AANVULLEN]</code> die de gepubliceerde bestanden uit de eerste stage naar de werkmap van de productie-stage kopieert.",
 regex:/^copy\s+--from[= ]build-env\s+\/out\/?\.?\s+(\.|\.\/|\/app\/?|\/app\/\.)$/i,answer:"<code>COPY --from=build-env /out .</code> (ook juist: <code>/app</code> als doel)",
 ex:["Haalt de dll's uit <code>/out</code> van de eerste stage naar de nieuwe. Vergeet de naam van de stage niet (de naam na <code>AS</code>)."]},
{n:20,type:"mc",pts:1,
 q:"Een ontwikkelaar bouwt een image voor een C-applicatie. <code>apt-get install gcc</code> duurt 2 minuten, het compileren 5 seconden. De broncode <code>main.c</code> verandert vaak. Welke Dockerfile is het efficiëntst?",
 opts:["<pre>FROM debian:12\nCOPY main.c .\nRUN apt-get update && apt-get install -y gcc\nRUN gcc main.c -o myapp\nCMD [\"./myapp\"]</pre>",
 "<pre>FROM debian:12\nRUN apt-get update && apt-get install -y gcc && rm -rf /var/lib/apt/lists/*\nCOPY main.c .\nRUN gcc main.c -o myapp\nCMD [\"./myapp\"]</pre>",
 "<pre>FROM debian:12\nRUN apt-get update && apt-get install -y gcc\nRUN gcc main.c -o myapp\nCOPY main.c .\nCMD [\"./myapp\"]</pre>",
 "<pre>FROM debian:12\nCOPY . .\nRUN gcc main.c -o myapp\nRUN apt-get update && apt-get install -y gcc</pre>"],ok:[1],
 ex:["Oefen het lezen: een Dockerfile loopt van boven naar onder. Vraag bij elke regel wat er al bestaat. C compileert voor <code>main.c</code> er is, D gebruikt gcc voor het geïnstalleerd is.","Cache: wijzigt een regel, dan wordt alles erna opnieuw uitgevoerd. Wat zelden verandert zet je dus bovenaan (A installeert gcc opnieuw bij elke codewijziging)."]},
{n:21,type:"open",pts:2,oos:true,
 q:"Gegeven deze Dockerfile:<pre>FROM almalinux:9\nUSER user1\nCMD echo \"Uitgevoerd door $(whoami)\"</pre>De image bouwt zonder fouten, maar <code>docker run</code> faalt. Waarom, en hoe los je het op?",
 model:["De gebruiker <code>user1</code> bestaat niet in de image: <i>unable to find user user1</i>.","Oplossing: draai als root, of maak hem eerst aan vóór <code>USER</code>: <code>RUN groupadd user1 &amp;&amp; useradd -g user1 user1</code>."]},
{n:22,type:"mc",pts:1,q:"Waarvoor dient het bestand <code>.dockerignore</code>?",
 opts:["Het bevat containers die Docker moet negeren bij <code>docker ps</code>.","Het sluit bestanden en mappen uit de build context uit, zodat ze niet naar de builder gestuurd en niet per ongeluk in de image gekopieerd worden.","Het bevat instructies uit de Dockerfile die overgeslagen moeten worden.","Het zorgt ervoor dat een container bepaalde poorten niet publiceert."],ok:[1],
 ex:["Bv. <code>.git</code>, <code>node_modules</code> of <code>.env</code> met wachtwoorden horen niet in de build context."]},
{n:23,type:"mc",pts:1,q:"Waarvoor dient de instructie WORKDIR in een Dockerfile?",
 opts:["Ze herstart de container automatisch als die faalt.","Ze bepaalt welk programma start, net zoals CMD.","Ze stelt de werkmap in voor alle volgende RUN-, CMD-, ENTRYPOINT- en COPY-instructies.","Ze maakt een omgevingsvariabele aan met het pad naar de broncode."],ok:[2],
 ex:["Bestaat de map nog niet, dan maakt WORKDIR ze aan."]},
{n:24,type:"fill",pts:2,oos:true,
 q:"Gegeven deze <code>docker-compose.yml</code>:<pre>services:\n  frontend-app:\n    image: nginx:alpine\n    ports:\n      - \"4000:80\"\n  data-service:\n    image: my-api-server\n    ports:\n      - \"6000:9000\"</pre><code>data-service</code> luistert in de container op poort 9000. Welke URL gebruikt de <code>frontend-app</code>-container om <code>data-service</code> aan te spreken?",
 accept:["http://data-service:9000","http://data-service:9000/","data-service:9000"],answer:"<code>http://data-service:9000</code>",
 ex:["De servicenaam (DNS van Compose) en de containerpoort, niet de hostpoort 6000. Vanaf de host zelf gebruik je wel <code>localhost:6000</code>."]},
{n:25,type:"multi",pts:2,
 q:"In deze <code>docker-compose.yml</code> zitten twee fouten: WordPress vindt de database niet, en na <code>docker compose down</code> en <code>up</code> is de database leeg. Welke aanpassingen lossen samen beide problemen op?<pre>services:\n  data:\n    image: mysql:8\n    restart: always\n    environment:\n      MYSQL_ROOT_PASSWORD: supersecretroot\n      MYSQL_DATABASE: wordpress\n      MYSQL_USER: wordpress\n      MYSQL_PASSWORD: supersecret\n  wordpress:\n    depends_on:\n      - data\n    image: wordpress\n    ports:\n      - \"8000:80\"\n    restart: always\n    environment:\n      WORDPRESS_DB_HOST: wordpress\n      WORDPRESS_DB_USER: wordpress\n      WORDPRESS_DB_PASSWORD: supersecret\nvolumes:\n  db_data: {}</pre>",
 opts:["<code>WORDPRESS_DB_HOST: wordpress</code> vervangen door <code>WORDPRESS_DB_HOST: data</code>","<code>WORDPRESS_DB_HOST: wordpress</code> vervangen door <code>WORDPRESS_DB_HOST: localhost</code>","Bij de service <code>data</code> toevoegen: <code>volumes: - db_data:/var/lib/mysql</code>","Het blok <code>volumes: db_data: {}</code> onderaan verwijderen","Bij de service <code>wordpress</code> <code>ports: - \"3306:3306\"</code> toevoegen"],ok:[0,2],
 ex:["Services vinden elkaar via hun servicenaam: de databank heet <code>data</code>; <code>wordpress</code> verwijst naar zichzelf.","Het named volume is bovenaan gedeclareerd, maar wordt pas gebruikt als je het bij de service koppelt aan de map waar MySQL zijn data bewaart."]},
{n:26,type:"mc",pts:1,q:"Je staat in de map met <code>docker-compose.yml</code>. Met welk commando start je alle services in de achtergrond?",
 opts:["<code>docker compose start</code>","<code>docker compose up -d</code>","<code>docker run -d docker-compose.yml</code>","<code>docker compose build</code>"],ok:[1],
 ex:["<code>start</code> start enkel services die al aangemaakt zijn. <code>build</code> bouwt alleen images."]},
{n:27,type:"mc",pts:1,q:"Wat doet <code>docker compose down</code> (zonder extra opties)?",
 opts:["Het stopt en verwijdert de containers en het netwerk van het project. Named volumes blijven bestaan.","Het stopt de containers, maar verwijdert niets.","Het verwijdert containers, netwerk, volumes én images.","Het verwijdert enkel de volumes."],ok:[0],
 ex:["Volumes blijven, anders is je databank weg. Met <code>down -v</code> gaan ze wel mee. Images blijven altijd staan."]},
{n:28,type:"fill",pts:2,q:"Op je Linux-host draait een eigen registry op poort 5000. Je hebt net lokaal de image <code>httpbin:v1</code> gebouwd. Welke naam moet de image krijgen (met <code>docker tag</code>) om ze naar die registry te kunnen pushen?",
 accept:["localhost:5000/httpbin:v1","docker tag httpbin:v1 localhost:5000/httpbin:v1","127.0.0.1:5000/httpbin:v1"],answer:"<code>localhost:5000/httpbin:v1</code>",
 ex:["De naam begint met de registry (<code>host:poort</code>). Daarna: <code>docker push localhost:5000/httpbin:v1</code>."]},
{n:29,type:"mc",pts:1,q:"Je hebt lokaal de image <code>webapp:1.0</code> gebouwd. Je wil die publiceren in je eigen repository op Docker Hub. Je gebruikersnaam is <code>kdgstudent</code>. Welke reeks commando's werkt?",
 opts:["<code>docker login</code> → <code>docker tag webapp:1.0 kdgstudent/webapp:1.0</code> → <code>docker push kdgstudent/webapp:1.0</code>","<code>docker login</code> → <code>docker push webapp:1.0</code>","<code>docker tag kdgstudent/webapp:1.0</code> → <code>docker login</code> → <code>docker push kdgstudent/webapp:1.0</code>","<code>docker login</code> → <code>docker push kdgstudent webapp:1.0</code>"],ok:[0],
 ex:["De naam is zeer belangrijk: <code>account/naam:tag</code>. Zonder je account vooraan probeert Docker naar <code>docker.io/library/...</code> te pushen en krijg je <i>denied</i>.","<code>docker tag</code> heeft twee namen nodig: de bestaande en de nieuwe."]},
{n:30,type:"multi",pts:2,oos:true,q:"Naar welke van deze diensten kan je container images pushen?",
 opts:["Docker Hub","Quay.io","GitHub Container Registry (ghcr.io)","Google Artifact Registry","Docker Desktop","Docker Compose"],ok:[0,1,2,3],
 ex:["Docker Desktop en Docker Compose zijn tools, geen registries."]},
{n:31,type:"mc",pts:1,q:"Je wil weten uit hoeveel lagen de lokale image <code>webapp:1.0</code> bestaat. Hoe doe je dat het best?",
 opts:["Met <code>docker image inspect webapp:1.0</code>: je telt de sha256-waarden onder <code>RootFS</code> → <code>Layers</code>.","Met <code>docker ps -a</code>: elke regel is een laag.","Je telt het aantal regels in de Dockerfile.","Met <code>docker volume inspect webapp:1.0</code>."],ok:[0],
 ex:["Enkel RUN, COPY en ADD maken lagen. ENV, CMD, EXPOSE en LABEL niet."]}
];
